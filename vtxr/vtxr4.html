<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quest 3 Trench Run: High Horizon</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #overlay {
            position: absolute; top: 20px; left: 0; width: 100%;
            text-align: center; color: #00ff00; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-shadow: 0 0 5px #00ff00; pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="overlay">
        VOXEL TRENCH RUN v3<br>
        <span style="font-size:0.8em">Left Thumbstick to Fly | Horizon High</span>
    </div>

    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let trenchContainer, shipGroup;
        const chunks = [];
        
        // --- Settings ---
        const CHUNK_SIZE = 10;
        const CHUNK_COUNT = 16;     // More chunks for a higher horizon
        const TRENCH_WIDTH = 8;
        const TRENCH_HEIGHT = 5;
        const SCROLL_SPEED = 20.0;
        const TILT_ANGLE = Math.PI / 6; // 30 Degrees
        
        // Ship movement limits (Local to trench)
        const SHIP_LIMIT_X = 3.0;
        const SHIP_LIMIT_Y_MIN = 0.5;
        const SHIP_LIMIT_Y_MAX = 4.5;
        const SHIP_SPEED = 0.15;

        // --- Cel Shading Materials ---
        const format = ( window.WebGL2RenderingContext ) ? THREE.RedFormat : THREE.LuminanceFormat;
        const gradientColors = new Uint8Array([50, 100, 180, 255]); 
        const gradientMap = new THREE.DataTexture(gradientColors, 4, 1, format);
        gradientMap.needsUpdate = true;
        gradientMap.minFilter = THREE.NearestFilter;
        gradientMap.magFilter = THREE.NearestFilter;

        // Materials
        const matGrey = new THREE.MeshToonMaterial({ color: 0x444444, gradientMap: gradientMap });
        const matFeature = new THREE.MeshToonMaterial({ color: 0x777777, gradientMap: gradientMap });
        const matShipWhite = new THREE.MeshToonMaterial({ color: 0xdddddd, gradientMap: gradientMap });
        const matShipRed = new THREE.MeshToonMaterial({ color: 0xff3333, gradientMap: gradientMap });
        const matEngine = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }); 

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);
            const ambLight = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambLight);

            // --- World Construction ---
            
            trenchContainer = new THREE.Group();
            
            // POSITIONING LOGIC:
            // 1. Move it DOWN (y=-0.5) so it starts around knee/waist height.
            // 2. Move it FORWARD (z=-1.0) just slightly in front.
            // 3. Rotate X negative (-30deg). This makes the "Far" end (-Z) tilt UPWARDS.
            //    This creates the slope where the horizon is high, but the ship is low.
            trenchContainer.position.set(0, -0.5, -1.0);
            trenchContainer.rotation.x = -TILT_ANGLE; 
            
            scene.add(trenchContainer);

            // Generate Chunks
            for (let i = 0; i < CHUNK_COUNT; i++) {
                // Generate deep into the screen (-Z relative to container)
                const zPos = -i * CHUNK_SIZE;
                const chunk = createChunk(zPos);
                chunks.push(chunk);
                trenchContainer.add(chunk);
            }

            // Create Ship
            shipGroup = createVoxelShip();
            // Position ship relative to trench:
            // x: 0 (center)
            // y: 1.5 (hovering above floor)
            // z: 4 (Pushed "back" towards the player within the trench coords so it appears close)
            shipGroup.position.set(0, 1.5, 4); 
            trenchContainer.add(shipGroup);

            // AR Button
            const arBtn = ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test', 'local-floor'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            document.body.appendChild(arBtn);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createVoxelShip() {
            const ship = new THREE.Group();
            const s = 0.12; // Voxel Scale
            const geo = new THREE.BoxGeometry(s, s, s);

            function addV(x, y, z, mat) {
                const m = new THREE.Mesh(geo, mat);
                m.position.set(x*s, y*s, z*s);
                ship.add(m);
            }

            // X-Wing Voxel Construct
            // Body
            for(let z=-4; z<=3; z++) addV(0,0,z, matShipWhite);
            addV(0,0,-5, matShipRed); // Nose
            addV(0,1,0, matShipRed); // R2 Unit ish

            // Wings
            for(let i=1; i<=5; i++) {
                addV(-i, i*0.2, 0, matShipWhite); // TL
                addV(i, i*0.2, 0, matShipWhite);  // TR
                addV(-i, -i*0.2, 0, matShipWhite); // BL
                addV(i, -i*0.2, 0, matShipWhite); // BR
                
                // Cannons at tips
                if(i===5) {
                    addV(-i, i*0.2, -1, matFeature);
                    addV(i, i*0.2, -1, matFeature);
                    addV(-i, -i*0.2, -1, matFeature);
                    addV(i, -i*0.2, -1, matFeature);
                }
            }

            // Engines
            const addEng = (x,y) => {
                addV(x,y,2, matShipRed);
                const glow = new THREE.Mesh(new THREE.BoxGeometry(s*0.8,s*0.8,s*0.1), matEngine);
                glow.position.set(x*s,y*s, 2*s + 0.05);
                ship.add(glow);
            };
            addEng(-1.5, 0.5); addEng(1.5, 0.5);
            addEng(-1.5, -0.5); addEng(1.5, -0.5);

            // Light
            const l = new THREE.PointLight(0xffaa00, 1, 3);
            l.position.set(0, 0, 0);
            ship.add(l);

            return ship;
        }

        // --- Helper: Cell Shading + Wireframe ---
        function createCelMesh(geometry, material) {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);
            
            // Outline
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, lineMat);
            group.add(line);
            
            return group;
        }

        function createChunk(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;

            // 1. Floor
            const floor = createCelMesh(new THREE.BoxGeometry(TRENCH_WIDTH, 1, CHUNK_SIZE), matGrey);
            floor.position.y = -0.5; // Offset so surface is at 0
            group.add(floor);

            // 2. Walls
            const wGeo = new THREE.BoxGeometry(1, TRENCH_HEIGHT, CHUNK_SIZE);
            
            const lWall = createCelMesh(wGeo, matGrey);
            lWall.position.set(-(TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
            group.add(lWall);

            const rWall = createCelMesh(wGeo, matGrey);
            rWall.position.set((TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
            group.add(rWall);

            // 3. Random Features
            generateFeatures(group);

            return group;
        }

        function generateFeatures(group) {
            const count = Math.floor(Math.random() * 2) + 1;
            for(let i=0; i<count; i++) {
                const rnd = Math.random();
                const z = (Math.random() - 0.5) * (CHUNK_SIZE * 0.8);
                
                if (rnd < 0.25) {
                    // Bridge (High)
                    const b = createCelMesh(new THREE.BoxGeometry(TRENCH_WIDTH, 0.5, 1), matFeature);
                    b.position.set(0, 3.5, z);
                    group.add(b);
                } else if (rnd < 0.5) {
                    // Floor Turret
                    const t = createCelMesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), matFeature);
                    t.position.set((Math.random()-0.5)*(TRENCH_WIDTH-2), 0.4, z);
                    group.add(t);
                } else if (rnd < 0.75) {
                    // Wall Block
                    const wb = createCelMesh(new THREE.BoxGeometry(1, 1, 2), matFeature);
                    const side = Math.random() > 0.5 ? 1 : -1;
                    wb.position.set(side * (TRENCH_WIDTH/2 - 0.5), 1.5, z);
                    group.add(wb);
                }
            }
        }

        function handleInput() {
            const session = renderer.xr.getSession();
            if (!session) return;
            
            for (const source of session.inputSources) {
                if (source.handedness === 'left' && source.gamepad) {
                    const axes = source.gamepad.axes;
                    if (axes.length >= 4) {
                        // axes[2] is X, axes[3] is Y on Quest controllers usually
                        const x = axes[2]; 
                        const y = axes[3];

                        if (shipGroup) {
                            shipGroup.position.x -= x * SHIP_SPEED;
                            shipGroup.position.y -= y * SHIP_SPEED;

                            // Clamp
                            shipGroup.position.x = THREE.MathUtils.clamp(shipGroup.position.x, -SHIP_LIMIT_X, SHIP_LIMIT_X);
                            shipGroup.position.y = THREE.MathUtils.clamp(shipGroup.position.y, SHIP_LIMIT_Y_MIN, SHIP_LIMIT_Y_MAX);

                            // Banking visual
                            shipGroup.rotation.z = x * 0.5;
                            shipGroup.rotation.x = y * 0.3;
                        }
                    }
                }
            }
        }

        const clock = new THREE.Clock();

        function render() {
            const dt = clock.getDelta();

            handleInput();

            // Move Chunks
            // Since we generated -Z, we move them +Z (towards player)
            const move = SCROLL_SPEED * dt;
            
            let minZ = 0; // Track furthest point for recycling

            chunks.forEach(c => {
                c.position.z += move;
                if(c.position.z < minZ) minZ = c.position.z;
            });

            chunks.forEach(c => {
                // If chunk is too close (past the camera/ship), recycle
                // Ship is at z=4. Container starts at z=-1.
                // Safely recycle when z > 10
                if (c.position.z > 12) {
                    // Move to back
                    // We need to calculate the exact offset to snap to
                    // Current set covers [minZ ... ~10]
                    // We place it at minZ - CHUNK_SIZE
                    c.position.z = minZ - CHUNK_SIZE;

                    // Refresh logic (simple visibility toggle for variety)
                    // Children > 2 are features (0=floor, 1=lwall, 2=rwall)
                    for(let k=3; k<c.children.length; k++) {
                        c.children[k].visible = Math.random() > 0.4;
                    }
                }
            });

            renderer.render(scene, camera);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }
    </script>
</body>
</html>
