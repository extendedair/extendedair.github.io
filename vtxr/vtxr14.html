<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quest 3 Trench Run: Final Fixed</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #overlay {
            position: absolute; top: 20px; left: 0; width: 100%;
            text-align: center; color: #ffffff; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-shadow: 0 0 4px #000000; pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="overlay">
        // TRENCH RUN: FINAL FIXED //<br>
        <span style="font-size:0.8em">Left Stick: Fly | Right Trigger: Fire | Hit Targets</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let trenchContainer, shipGroup;
        const chunks = []; // Fixed array of chunk groups
        let audioCtx;

        // --- Configuration ---
        const CHUNK_SIZE = 12;
        const CHUNK_COUNT = 18; // Enough to cover view distance + buffer
        const TRENCH_WIDTH = 8;
        const TRENCH_HEIGHT = 6;
        const SCROLL_SPEED = 18.75; 
        const TILT_ANGLE = THREE.MathUtils.degToRad(10); 

        // Ship
        const SHIP_Z_POS = -15.3; 
        const SHIP_SPEED = 0.135; 
        const SHIP_LIMIT_X = 3.2;
        const SHIP_LIMIT_Y_MIN = 0.5;
        const SHIP_LIMIT_Y_MAX = 5.5;

        // Game State
        const bullets = [];
        const MAX_BULLETS = 6; 
        const particles = [];
        let isInvulnerable = false;
        let respawnTimer = 0;
        let fireCooldown = 0;
        
        let activeTargetCount = 0;
        const MAX_ACTIVE_TARGETS = 3;

        // --- Materials ---
        const format = ( window.WebGL2RenderingContext ) ? THREE.RedFormat : THREE.LuminanceFormat;
        const gradientMap = new THREE.DataTexture(new Uint8Array([60, 100, 140, 255]), 4, 1, format);
        gradientMap.needsUpdate = true;
        gradientMap.minFilter = THREE.NearestFilter;
        gradientMap.magFilter = THREE.NearestFilter;

        const matTrench = new THREE.MeshToonMaterial({ color: 0x555555, gradientMap: gradientMap });
        const matFeature = new THREE.MeshToonMaterial({ color: 0x777777, gradientMap: gradientMap });
        const matTall = new THREE.MeshToonMaterial({ color: 0x888899, gradientMap: gradientMap });
        const matLine = new THREE.LineBasicMaterial({ color: 0xbbbbbb, linewidth: 1, opacity: 0.5, transparent: true });

        const matShipBody = new THREE.MeshToonMaterial({ color: 0xeeeeee, gradientMap: gradientMap });
        const matShipDetail = new THREE.MeshToonMaterial({ color: 0xcc0000, gradientMap: gradientMap });
        const matEngine = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const matBullet = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const matExplosion = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const matTargetRed = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const matTargetBlue = new THREE.MeshBasicMaterial({ color: 0x0000ff });

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(0, 20, 10); 
            scene.add(dirLight);
            scene.add(new THREE.AmbientLight(0x404040, 1.0));

            // Container
            trenchContainer = new THREE.Group();
            trenchContainer.position.set(0, -6.0, -2.0);
            trenchContainer.rotation.x = TILT_ANGLE;
            scene.add(trenchContainer);

            // Initialize Chunks (Fixed Pool)
            for(let i=0; i<CHUNK_COUNT; i++) {
                const group = new THREE.Group();
                const z = -i * CHUNK_SIZE;
                group.position.z = z;
                
                // Populate content
                populateChunkContent(group);
                
                chunks.push(group);
                trenchContainer.add(group);
            }

            // Ship
            shipGroup = createVoxelShip();
            shipGroup.position.set(0, 2.0, SHIP_Z_POS); 
            trenchContainer.add(shipGroup);

            // Audio
            const setupAudio = () => {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
            };
            document.body.addEventListener('click', setupAudio);
            document.body.addEventListener('touchstart', setupAudio);

            const arBtn = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test', 'local-floor'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            arBtn.addEventListener('click', setupAudio);
            document.body.appendChild(arBtn);

            window.addEventListener('resize', onResize);
        }

        // --- Audio System ---
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const t = audioCtx.currentTime;

            if (type === 'explosion') {
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, t);
                filter.frequency.exponentialRampToValueAtTime(50, t + 1.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                gain.gain.setValueAtTime(1.0, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);

                noise.start();
                noise.stop(t + 1.5);
            } else if (type === 'laser') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(t + 0.1);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1500, t);
                osc.frequency.linearRampToValueAtTime(2200, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(t + 0.4);
            }
        }

        // --- Construction ---
        function createVoxelShip() {
            const ship = new THREE.Group();
            const s = 0.15; 
            const geo = new THREE.BoxGeometry(s,s,s);
            const add = (x,y,z,mat) => {
                const m = new THREE.Mesh(geo,mat);
                m.position.set(x*s, y*s, z*s);
                ship.add(m);
            };
            for(let z=-4; z<=3; z++) add(0,0,z, matShipBody);
            add(0,0,-5, matShipDetail); add(0,0.8,0, matShipDetail); 
            for(let i=1; i<=5; i++) {
                add(-i, i*0.25, 1, matShipBody); add(i, i*0.25, 1, matShipBody);
                add(-i, -i*0.25, 1, matShipBody); add(i, -i*0.25, 1, matShipBody);
                if(i===5) { 
                   add(-i, i*0.25, -1, matTrench); add(i, i*0.25, -1, matTrench);
                   add(-i, -i*0.25, -1, matTrench); add(i, -i*0.25, -1, matTrench); 
                }
            }
            add(-1.5, 0.5, 2, matShipDetail); add(1.5, 0.5, 2, matShipDetail);
            add(-1.5, -0.5, 2, matShipDetail); add(1.5, -0.5, 2, matShipDetail);
            const glowGeo = new THREE.BoxGeometry(s*0.8, s*0.8, s*0.1);
            const addGlow = (x,y) => {
                const m = new THREE.Mesh(glowGeo, matEngine);
                m.position.set(x*s, y*s, 2*s + 0.05);
                ship.add(m);
            };
            addGlow(-1.5, 0.5); addGlow(1.5, 0.5); addGlow(-1.5, -0.5); addGlow(1.5, -0.5);
            return ship;
        }

        function createCelMesh(geo, mat) {
            const g = new THREE.Group();
            const m = new THREE.Mesh(geo, mat);
            g.add(m);
            g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), matLine));
            g.userData.isObstacle = true;
            return g;
        }

        function populateChunkContent(group) {
            // Clean up existing
            while(group.children.length > 0) {
                const child = group.children[0];
                group.remove(child);
                if(child.geometry) child.geometry.dispose();
            }

            // Floor
            const floor = new THREE.Mesh(new THREE.BoxGeometry(TRENCH_WIDTH, 1, CHUNK_SIZE), matTrench);
            floor.position.y = -0.5;
            floor.add(new THREE.LineSegments(new THREE.EdgesGeometry(floor.geometry), matLine));
            group.add(floor);

            // Walls
            const wGeo = new THREE.BoxGeometry(1, TRENCH_HEIGHT, CHUNK_SIZE);
            const lw = new THREE.Mesh(wGeo, matTrench);
            lw.position.set(-(TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
            lw.add(new THREE.LineSegments(new THREE.EdgesGeometry(wGeo), matLine));
            group.add(lw);
            
            const rw = new THREE.Mesh(wGeo, matTrench);
            rw.position.set((TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
            rw.add(new THREE.LineSegments(new THREE.EdgesGeometry(wGeo), matLine));
            group.add(rw);

            // Obstacles & Targets
            group.userData.targetCount = 0;
            
            // Multiple attempts per chunk for density
            for(let k=0; k<3; k++) {
                if(Math.random() > 0.4) {
                    const type = Math.random();
                    const lz = (Math.random()-0.5)*(CHUNK_SIZE*0.9);
                    let obs = null;
                    let canTarget = false;

                    if(type < 0.25) { // Bridge
                        const h = Math.random() * 2.0 + 2.5;
                        obs = createCelMesh(new THREE.BoxGeometry(TRENCH_WIDTH, 0.5, 1), matFeature);
                        obs.position.set(0, h, lz);
                        canTarget = true;
                    } 
                    else if(type < 0.5) { // Turret
                        obs = createCelMesh(new THREE.BoxGeometry(1.2,1,1.2), matFeature);
                        obs.position.set((Math.random()-0.5)*(TRENCH_WIDTH-2), 0.5, lz);
                        canTarget = true;
                    } 
                    else if(type < 0.75) { // Tall Block
                        const h = 2 + Math.random();
                        obs = createCelMesh(new THREE.BoxGeometry(1.2, h, 1.2), matTall);
                        const xPos = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 1.5 + 1);
                        obs.position.set(xPos, h/2, lz);
                        canTarget = true;
                    }
                    else { // Pipe
                        obs = createCelMesh(new THREE.CylinderGeometry(0.4,0.4,1.5, 8), matFeature);
                        obs.children[0].rotation.z = Math.PI/2; 
                        const s = Math.random()>0.5?1:-1;
                        obs.position.set(s*(TRENCH_WIDTH/2 - 0.5), 2.5, lz);
                    }

                    if(obs) {
                        // Add Target?
                        if(canTarget && activeTargetCount < MAX_ACTIVE_TARGETS && Math.random() > 0.6) {
                            const tGeo = new THREE.CircleGeometry(0.35, 16);
                            const tMesh = new THREE.Mesh(tGeo, matTargetRed);
                            tMesh.userData.isTarget = true;
                            tMesh.userData.active = true;
                            
                            // Approximate depth offset to put target on "front"
                            tMesh.position.z = 0.65; // Obstacles are usually depth 1.0 or 1.2
                            tMesh.position.y = 0;
                            
                            obs.add(tMesh);
                            activeTargetCount++;
                            group.userData.targetCount++;
                        }
                        group.add(obs);
                    }
                }
            }
        }

        // --- Logic ---
        function fire() {
            if(fireCooldown > 0 || bullets.length >= MAX_BULLETS) return;
            fireCooldown = 0.2; 
            playSound('laser');

            const createB = (offsetX) => {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.15), matBullet);
                b.position.copy(shipGroup.position);
                b.position.x += offsetX;
                b.position.y += 0.25; 
                b.position.z -= 0.1; // Spawn at wing
                b.userData.box = new THREE.Box3();
                trenchContainer.add(b);
                bullets.push(b);
            };
            createB(-0.7); // Tucked in
            createB(0.7);
        }

        function createExplosion(pos) {
            playSound('explosion');
            for(let i=0; i<12; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), matExplosion);
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(Math.random()*8);
                p.userData.life = 1.2;
                trenchContainer.add(p);
                particles.push(p);
            }
        }

        // Collision reusable objects
        const shipBox = new THREE.Box3();
        const obsBox = new THREE.Box3();
        const targetWorldPos = new THREE.Vector3();
        const bulletWorldPos = new THREE.Vector3();

        function checkCollisions() {
            // 1. Ship vs Obstacles
            if(!isInvulnerable) {
                shipBox.setFromObject(shipGroup);
                shipBox.expandByScalar(-0.1); 

                for(const chunk of chunks) {
                    if(Math.abs(chunk.position.z - SHIP_Z_POS) < CHUNK_SIZE) {
                        for(const child of chunk.children) {
                            if(child.userData.isObstacle && child.visible) {
                                obsBox.setFromObject(child);
                                if(shipBox.intersectsBox(obsBox)) {
                                    createExplosion(shipGroup.position);
                                    isInvulnerable = true;
                                    respawnTimer = 2.0;
                                    return; // Only hit one thing per frame
                                }
                            }
                        }
                    }
                }
            }

            // 2. Bullets vs Obstacles & Targets
            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.userData.box.setFromObject(b);
                let destroyed = false;

                for(const chunk of chunks) {
                    // Check nearby chunks
                    if(Math.abs(chunk.position.z - b.position.z) < CHUNK_SIZE) {
                        for(const obs of chunk.children) {
                            if(obs.userData.isObstacle) {
                                obsBox.setFromObject(obs);
                                if(b.userData.box.intersectsBox(obsBox)) {
                                    destroyed = true;
                                    
                                    // Did we hit a target on this obstacle?
                                    for(const sub of obs.children) {
                                        if(sub.userData.isTarget && sub.userData.active) {
                                            sub.getWorldPosition(targetWorldPos);
                                            b.getWorldPosition(bulletWorldPos);
                                            if(bulletWorldPos.distanceTo(targetWorldPos) < 0.8) {
                                                sub.userData.active = false;
                                                sub.material = matTargetBlue;
                                                playSound('coin');
                                            }
                                        }
                                    }
                                    break; 
                                }
                            }
                        }
                    }
                    if(destroyed) break;
                }

                if(destroyed) {
                    createExplosion(b.position);
                    trenchContainer.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        function render() {
            const dt = clock.getDelta();

            // Input
            if(fireCooldown > 0) fireCooldown -= dt;
            const session = renderer.xr.getSession();
            if(session) {
                for(const src of session.inputSources) {
                    if(src.gamepad) {
                        // Fly
                        if(src.handedness === 'left' && src.gamepad.axes.length >= 4) {
                            const x = src.gamepad.axes[2];
                            const y = src.gamepad.axes[3];
                            shipGroup.position.x += x * SHIP_SPEED;
                            shipGroup.position.y -= y * SHIP_SPEED;
                            shipGroup.rotation.z = -x * 0.4; 
                            shipGroup.rotation.x = y * 0.2;
                            shipGroup.position.x = Math.max(-SHIP_LIMIT_X, Math.min(SHIP_LIMIT_X, shipGroup.position.x));
                            shipGroup.position.y = Math.max(SHIP_LIMIT_Y_MIN, Math.min(SHIP_LIMIT_Y_MAX, shipGroup.position.y));
                        }
                        // Fire
                        if(src.gamepad.buttons[0]?.pressed || src.gamepad.buttons[4]?.pressed) fire();
                    }
                }
            }

            // Entity Updates
            if(isInvulnerable) {
                respawnTimer -= dt;
                if(respawnTimer <= 0) { isInvulnerable = false; shipGroup.visible = true; }
                else { shipGroup.visible = Math.floor(respawnTimer * 10) % 2 === 0; }
            }

            for(let i=bullets.length-1; i>=0; i--) {
                bullets[i].position.z -= 40 * dt; 
                if(bullets[i].position.z < -70) {
                    trenchContainer.remove(bullets[i]);
                    bullets.splice(i, 1);
                }
            }

            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.position.addScaledVector(p.userData.vel, dt);
                p.userData.life -= dt;
                p.scale.multiplyScalar(0.9);
                if(p.userData.life <= 0) {
                    trenchContainer.remove(p);
                    particles.splice(i, 1);
                }
            }

            checkCollisions();

            // Scroll
            const move = SCROLL_SPEED * dt;
            
            // Find lowest Z to snap to end
            let minZ = 1000;
            for(const c of chunks) minZ = Math.min(minZ, c.position.z);

            for(const c of chunks) {
                c.position.z += move;
                
                // Recycle if passed camera
                if(c.position.z > 8) {
                    // Release targets
                    if(c.userData.targetCount) {
                        activeTargetCount -= c.userData.targetCount;
                        c.userData.targetCount = 0;
                    }
                    
                    // Move to back
                    c.position.z = minZ - CHUNK_SIZE;
                    // Note: minZ will change as we iterate if we don't calculate it once pre-loop, 
                    // but in this setup, all chunks move uniformly, so pre-calc minZ is correct for the 'tail'.
                    
                    // Regenerate
                    populateChunkContent(c);
                }
            }

            renderer.render(scene, camera);
        }

        const clock = new THREE.Clock();
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
