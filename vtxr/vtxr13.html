<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quest 3 Trench Run: Targets</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #overlay {
            position: absolute; top: 20px; left: 0; width: 100%;
            text-align: center; color: #ffffff; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-shadow: 0 0 4px #000000; pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="overlay">
        // TRENCH RUN: TARGET PRACTICE //<br>
        <span style="font-size:0.8em">L-Stick: Fly | R-Trigger: Fire | Hit Red Targets</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let trenchContainer, shipGroup;
        const chunks = [];
        let audioCtx;

        // --- Configuration ---
        const CHUNK_SIZE = 12;
        const CHUNK_COUNT = 16;
        const TRENCH_WIDTH = 8;
        const TRENCH_HEIGHT = 6;
        const SCROLL_SPEED = 18.75; 
        const TILT_ANGLE = THREE.MathUtils.degToRad(10); 

        // Ship Handling
        // Pos: Moved 10% closer (-17.0 * 0.9 = -15.3)
        const SHIP_Z_POS = -15.3; 
        // Speed: Reduced by 10% (0.15 * 0.9 = 0.135)
        const SHIP_SPEED = 0.135; 
        const SHIP_LIMIT_X = 3.2;
        const SHIP_LIMIT_Y_MIN = 0.5;
        const SHIP_LIMIT_Y_MAX = 5.5;

        // Game State
        const bullets = [];
        const MAX_BULLETS = 6; 
        const particles = [];
        let isInvulnerable = false;
        let respawnTimer = 0;
        let fireCooldown = 0;
        
        // Target Logic
        let activeTargetCount = 0;
        const MAX_ACTIVE_TARGETS = 3;

        // --- Materials ---
        const format = ( window.WebGL2RenderingContext ) ? THREE.RedFormat : THREE.LuminanceFormat;
        const gradientMap = new THREE.DataTexture(new Uint8Array([60, 100, 140, 255]), 4, 1, format);
        gradientMap.needsUpdate = true;
        gradientMap.minFilter = THREE.NearestFilter;
        gradientMap.magFilter = THREE.NearestFilter;

        const matTrench = new THREE.MeshToonMaterial({ color: 0x555555, gradientMap: gradientMap });
        const matFeature = new THREE.MeshToonMaterial({ color: 0x777777, gradientMap: gradientMap });
        const matTall = new THREE.MeshToonMaterial({ color: 0x888899, gradientMap: gradientMap });
        const matLine = new THREE.LineBasicMaterial({ color: 0xbbbbbb, linewidth: 1, opacity: 0.5, transparent: true });

        const matShipBody = new THREE.MeshToonMaterial({ color: 0xeeeeee, gradientMap: gradientMap });
        const matShipDetail = new THREE.MeshToonMaterial({ color: 0xcc0000, gradientMap: gradientMap });
        const matEngine = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const matBullet = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const matExplosion = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        
        // Targets
        const matTargetRed = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const matTargetBlue = new THREE.MeshBasicMaterial({ color: 0x0000ff });

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(0, 20, 10); 
            scene.add(dirLight);
            scene.add(new THREE.AmbientLight(0x404040, 1.0));

            trenchContainer = new THREE.Group();
            trenchContainer.position.set(0, -6.0, -2.0);
            trenchContainer.rotation.x = TILT_ANGLE;
            scene.add(trenchContainer);

            // Chunks
            for(let i=0; i<CHUNK_COUNT; i++) {
                const z = -i * CHUNK_SIZE;
                const chunk = createChunk(z);
                chunks.push(chunk);
                trenchContainer.add(chunk);
            }

            shipGroup = createVoxelShip();
            shipGroup.position.set(0, 2.0, SHIP_Z_POS); 
            trenchContainer.add(shipGroup);

            // Audio Interaction Setup
            const setupAudio = () => {
                if(!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if(audioCtx.state === 'suspended') audioCtx.resume();
            };
            document.body.addEventListener('click', setupAudio);
            document.body.addEventListener('touchstart', setupAudio);
            const arBtn = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test', 'local-floor'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            arBtn.addEventListener('click', setupAudio); 
            document.body.appendChild(arBtn);

            window.addEventListener('resize', onResize);
        }

        // --- Audio System ---
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const t = audioCtx.currentTime;

            if (type === 'explosion') {
                // Deeper, longer explosion
                // Create Noise Buffer
                const bufferSize = audioCtx.sampleRate * 1.0; // 1 second length
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // Lowpass filter for "Depth"
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, t);
                filter.frequency.exponentialRampToValueAtTime(100, t + 0.8);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                gain.gain.setValueAtTime(0.8, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 1.0); // Longer tail

                noise.start();
                noise.stop(t + 1.0);

            } else if (type === 'laser') {
                // Retro Pew Pew
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, t);
                osc.frequency.exponentialRampToValueAtTime(110, t + 0.15); // Fast sweep down

                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(t + 0.15);

            } else if (type === 'coin') {
                // Ding / Chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, t);
                osc.frequency.linearRampToValueAtTime(1800, t + 0.05);

                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(t + 0.3);
            }
        }

        // --- Generators ---
        function createVoxelShip() {
            const ship = new THREE.Group();
            const s = 0.15; 
            const geo = new THREE.BoxGeometry(s,s,s);
            const add = (x,y,z,mat) => {
                const m = new THREE.Mesh(geo,mat);
                m.position.set(x*s, y*s, z*s);
                ship.add(m);
            };
            // Fuselage
            for(let z=-4; z<=3; z++) add(0,0,z, matShipBody);
            add(0,0,-5, matShipDetail); add(0,0.8,0, matShipDetail); 
            // Wings
            for(let i=1; i<=5; i++) {
                add(-i, i*0.25, 1, matShipBody); add(i, i*0.25, 1, matShipBody);
                add(-i, -i*0.25, 1, matShipBody); add(i, -i*0.25, 1, matShipBody);
                if(i===5) { 
                   add(-i, i*0.25, -1, matTrench); add(i, i*0.25, -1, matTrench);
                   add(-i, -i*0.25, -1, matTrench); add(i, -i*0.25, -1, matTrench); 
                }
            }
            // Engines
            add(-1.5, 0.5, 2, matShipDetail); add(1.5, 0.5, 2, matShipDetail);
            add(-1.5, -0.5, 2, matShipDetail); add(1.5, -0.5, 2, matShipDetail);
            // Glow
            const glowGeo = new THREE.BoxGeometry(s*0.8, s*0.8, s*0.1);
            const addGlow = (x,y) => {
                const m = new THREE.Mesh(glowGeo, matEngine);
                m.position.set(x*s, y*s, 2*s + 0.05);
                ship.add(m);
            };
            addGlow(-1.5, 0.5); addGlow(1.5, 0.5); addGlow(-1.5, -0.5); addGlow(1.5, -0.5);

            return ship;
        }

        function createCelMesh(geo, mat) {
            const g = new THREE.Group();
            const m = new THREE.Mesh(geo, mat);
            g.add(m);
            g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), matLine));
            g.userData.isObstacle = true;
            return g;
        }

        function createTarget() {
            // Circle Mesh on front face
            const g = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.CircleGeometry(0.35, 16), matTargetRed);
            mesh.userData.isTarget = true;
            mesh.userData.active = true;
            g.add(mesh);
            return g;
        }

        function createChunk(z) {
            const g = new THREE.Group();
            g.position.z = z;

            // Floor
            const floor = new THREE.Mesh(new THREE.BoxGeometry(TRENCH_WIDTH, 1, CHUNK_SIZE), matTrench);
            floor.position.y = -0.5;
            floor.add(new THREE.LineSegments(new THREE.EdgesGeometry(floor.geometry), matLine));
            g.add(floor);

            // Walls
            const wGeo = new THREE.BoxGeometry(1, TRENCH_HEIGHT, CHUNK_SIZE);
            const lw = new THREE.Mesh(wGeo, matTrench);
            lw.position.set(-(TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
            lw.add(new THREE.LineSegments(new THREE.EdgesGeometry(wGeo), matLine));
            g.add(lw);
            
            const rw = new THREE.Mesh(wGeo, matTrench);
            rw.position.set((TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
            rw.add(new THREE.LineSegments(new THREE.EdgesGeometry(wGeo), matLine));
            g.add(rw);

            // Features
            let targetsAdded = 0;
            for(let k=0; k<3; k++) {
                if(Math.random() > 0.4) {
                    const type = Math.random();
                    const lz = (Math.random()-0.5)*(CHUNK_SIZE*0.9);
                    
                    let obs = null;
                    let canHaveTarget = false;
                    let targetYOffset = 0;

                    if(type < 0.25) { // Bridge
                        const h = Math.random() * 2.0 + 2.5;
                        obs = createCelMesh(new THREE.BoxGeometry(TRENCH_WIDTH, 0.5, 1), matFeature);
                        obs.position.set(0, h, lz);
                        // Bridges face forward, add target to front
                        canHaveTarget = true;
                        targetYOffset = 0;
                    } 
                    else if(type < 0.5) { // Turret
                        obs = createCelMesh(new THREE.BoxGeometry(1.2,1,1.2), matFeature);
                        obs.position.set((Math.random()-0.5)*(TRENCH_WIDTH-2), 0.5, lz);
                        canHaveTarget = true;
                    } 
                    else if(type < 0.75) { // Tall Block
                        const h = 2 + Math.random();
                        obs = createCelMesh(new THREE.BoxGeometry(1.2, h, 1.2), matTall);
                        const xPos = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 1.5 + 1);
                        obs.position.set(xPos, h/2, lz);
                        canHaveTarget = true;
                    }
                    else { // Pipe
                        obs = createCelMesh(new THREE.CylinderGeometry(0.4,0.4,1.5, 8), matFeature);
                        obs.children[0].rotation.z = Math.PI/2; 
                        const s = Math.random()>0.5?1:-1;
                        obs.position.set(s*(TRENCH_WIDTH/2 - 0.5), 2.5, lz);
                    }

                    if(obs) {
                        // Attempt to add target
                        if(canHaveTarget && activeTargetCount < MAX_ACTIVE_TARGETS && Math.random() > 0.6) {
                            const t = createTarget();
                            // Position on Front Face (+Z face of obstacle relative to obstacle center)
                            // Box depths are roughly 1 or 1.2.
                            // Ship flies -Z, Chunks move +Z. 
                            // The face facing the ship (which is at -15) is the +Z face of the obstacle.
                            
                            // Determine depth roughly
                            let d = 1.0;
                            if(type>=0.25 && type<0.5) d=1.2; // Turret
                            if(type>=0.5 && type<0.75) d=1.2; // Tall

                            t.position.z = (d/2) + 0.05; // Slightly in front
                            t.position.y = targetYOffset;
                            
                            // Attach to obstacle group
                            obs.add(t);
                            activeTargetCount++;
                            // Mark chunk as holding a target so we can decrement on recycle
                            if(!g.userData.targetCount) g.userData.targetCount = 0;
                            g.userData.targetCount++;
                        }
                        g.add(obs);
                    }
                }
            }
            return g;
        }

        function fire() {
            if(fireCooldown > 0 || bullets.length >= MAX_BULLETS) return;
            fireCooldown = 0.2; 
            playSound('laser');

            const createB = (offsetX) => {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.15), matBullet);
                b.position.copy(shipGroup.position);
                // Adjust position: Inward (0.9 vs 1.2) and Back (0.2 vs 1.0)
                b.position.x += offsetX;
                b.position.y += 0.25; 
                b.position.z -= 0.2;  // Closer to wing
                
                // Bullet Box for collision
                b.userData.box = new THREE.Box3();
                
                trenchContainer.add(b);
                bullets.push(b);
            };
            // Inward wing position
            createB(-0.9);
            createB(0.9);
        }

        function createExplosion(pos) {
            playSound('explosion');
            for(let i=0; i<12; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.25,0.25), matExplosion);
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3(
                    (Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)
                ).normalize().multiplyScalar(Math.random()*6);
                p.userData.life = 1.2;
                trenchContainer.add(p);
                particles.push(p);
            }
        }

        // --- Collision Logic ---
        const shipBox = new THREE.Box3();
        const obsBox = new THREE.Box3();

        function handleShipCollision() {
            if(isInvulnerable) return;
            createExplosion(shipGroup.position);
            isInvulnerable = true;
            respawnTimer = 2.0;
        }

        function handleTargetHit(targetMesh) {
            if(targetMesh.userData.active) {
                targetMesh.userData.active = false;
                targetMesh.material = matTargetBlue; // Turn Blue
                playSound('coin');
            }
        }

        function checkCollisions() {
            // 1. Ship vs Obstacles
            if(!isInvulnerable) {
                shipBox.setFromObject(shipGroup);
                shipBox.expandByScalar(-0.1); 

                for(const chunk of chunks) {
                    if(Math.abs(chunk.position.z - SHIP_Z_POS) < CHUNK_SIZE) {
                        for(const child of chunk.children) {
                            if(child.userData.isObstacle && child.visible) {
                                obsBox.setFromObject(child);
                                if(shipBox.intersectsBox(obsBox)) {
                                    handleShipCollision();
                                    break;
                                }
                            }
                        }
                    }
                }
            }

            // 2. Bullets vs Obstacles/Targets
            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.userData.box.setFromObject(b);
                let hit = false;

                // Check nearby chunks
                for(const chunk of chunks) {
                    // Optimization: Bullet is moving -Z (away from camera). 
                    // Chunks are moving +Z.
                    if(Math.abs(chunk.position.z - b.position.z) < CHUNK_SIZE) {
                        for(const obs of chunk.children) {
                            if(obs.userData.isObstacle && obs.visible) {
                                obsBox.setFromObject(obs);
                                if(b.userData.box.intersectsBox(obsBox)) {
                                    hit = true;
                                    
                                    // Check if this obstacle has a target attached
                                    // Targets are children of the obstacle group
                                    // We need to check exact intersection with target mesh?
                                    // Simplified: If bullet hits obstacle, check if bullet hits target bounds
                                    for(const sub of obs.children) {
                                        if(sub.userData.isTarget && sub.userData.active) {
                                            // Simple distance check to target center
                                            // Target is in local space of obstacle
                                            const targetWorldPos = new THREE.Vector3();
                                            sub.getWorldPosition(targetWorldPos);
                                            // Bullet is at b.position (World relative to container)
                                            // Actually b is in trenchContainer, obs is in chunk in trenchContainer
                                            // Get both in World Space for distance
                                            const bulletWorld = new THREE.Vector3();
                                            b.getWorldPosition(bulletWorld);
                                            
                                            if(bulletWorld.distanceTo(targetWorldPos) < 0.6) {
                                                handleTargetHit(sub);
                                            }
                                        }
                                    }
                                    break; // Bullet destroys on first object hit
                                }
                            }
                        }
                    }
                    if(hit) break;
                }

                if(hit) {
                    createExplosion(b.position); // Small puff for bullet impact
                    trenchContainer.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        // --- Loop ---

        function handleInput(dt) {
            if(fireCooldown > 0) fireCooldown -= dt;

            const session = renderer.xr.getSession();
            if(!session) return;
            
            for(const src of session.inputSources) {
                if(src.gamepad) {
                    // Flight
                    if(src.handedness === 'left' && src.gamepad.axes.length >= 4) {
                        const x = src.gamepad.axes[2];
                        const y = src.gamepad.axes[3];
                        
                        shipGroup.position.x += x * SHIP_SPEED;
                        shipGroup.position.y -= y * SHIP_SPEED;
                        
                        shipGroup.rotation.z = -x * 0.4; 
                        shipGroup.rotation.x = y * 0.2;

                        shipGroup.position.x = Math.max(-SHIP_LIMIT_X, Math.min(SHIP_LIMIT_X, shipGroup.position.x));
                        shipGroup.position.y = Math.max(SHIP_LIMIT_Y_MIN, Math.min(SHIP_LIMIT_Y_MAX, shipGroup.position.y));
                    }
                    // Fire
                    if(src.gamepad.buttons[0]?.pressed || src.gamepad.buttons[4]?.pressed) {
                        fire();
                    }
                }
            }
        }

        function updateEntities(dt) {
            if(isInvulnerable) {
                respawnTimer -= dt;
                if(respawnTimer <= 0) {
                    isInvulnerable = false;
                    shipGroup.visible = true;
                } else {
                    shipGroup.visible = Math.floor(respawnTimer * 10) % 2 === 0;
                }
            }

            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.position.z -= 40 * dt; 
                if(b.position.z < -60) {
                    trenchContainer.remove(b);
                    bullets.splice(i, 1);
                }
            }

            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.position.addScaledVector(p.userData.vel, dt);
                p.userData.life -= dt;
                p.scale.multiplyScalar(0.9);
                if(p.userData.life <= 0) {
                    trenchContainer.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function render() {
            const dt = clock.getDelta();
            
            handleInput(dt);
            checkCollisions();
            updateEntities(dt);

            const move = SCROLL_SPEED * dt;
            let minZ = 0;
            chunks.forEach(c => minZ = Math.min(minZ, c.position.z));

            chunks.forEach(c => {
                c.position.z += move;
                // Recycling
                if(c.position.z > 8) {
                    // Before reset, release active target counts
                    if(c.userData.targetCount) {
                        activeTargetCount -= c.userData.targetCount;
                        c.userData.targetCount = 0;
                    }

                    c.position.z = minZ - CHUNK_SIZE;
                    // Destroy old children to regenerate with new target logic
                    // (Simpler than toggling visibility for dynamic targets)
                    trenchContainer.remove(c);
                    // Make new chunk
                    // Remove from array? 
                    // To keep array simple, we just clear the group and rebuild
                    c.clear();
                    
                    // Rebuild Logic (Duplicated from CreateChunk roughly, but simplified for brevity)
                    // Floor
                    const floor = new THREE.Mesh(new THREE.BoxGeometry(TRENCH_WIDTH, 1, CHUNK_SIZE), matTrench);
                    floor.position.y = -0.5;
                    floor.add(new THREE.LineSegments(new THREE.EdgesGeometry(floor.geometry), matLine));
                    c.add(floor);
                    // Walls
                    const wGeo = new THREE.BoxGeometry(1, TRENCH_HEIGHT, CHUNK_SIZE);
                    const lw = new THREE.Mesh(wGeo, matTrench);
                    lw.position.set(-(TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
                    lw.add(new THREE.LineSegments(new THREE.EdgesGeometry(wGeo), matLine));
                    c.add(lw);
                    const rw = new THREE.Mesh(wGeo, matTrench);
                    rw.position.set((TRENCH_WIDTH/2 + 0.5), TRENCH_HEIGHT/2 - 0.5, 0);
                    rw.add(new THREE.LineSegments(new THREE.EdgesGeometry(wGeo), matLine));
                    c.add(rw);

                    // Re-run generator logic
                    // ... (Inline logic for regeneration) ...
                    // For code compactness in single file, I'll call a helper, but since I can't easily refactor createChunk in this flow without breaking the object ref:
                    // Actually, simpler is to just remove C from array/scene and push new one.
                }
            });
            
            // Clean up array approach for recycling
            // Filter out chunks that were removed and add new ones at the back
            // (Actually, simpler to just modify the existing loop to remove/add)
            // Let's stick to the visible toggle for performance, but we need to Handle Targets explicitly.
            
            // Correction: The easiest way to handle "Regenerate" is just to perform the `createChunk` logic again on the existing group object.
            // But for this demo, let's do the "Remove and Replace" strategy in the loop above.
            
            // Actually, let's fix the recycling properly:
            // The loop above iterates `chunks`.
            // If we find one to recycle:
            const toRecycleIndex = chunks.findIndex(c => c.position.z > 8);
            if(toRecycleIndex !== -1) {
                const c = chunks[toRecycleIndex];
                // Decrement counters
                if(c.userData.targetCount) activeTargetCount -= c.userData.targetCount;
                trenchContainer.remove(c);
                chunks.splice(toRecycleIndex, 1);
                
                // New Chunk
                const newZ = minZ - CHUNK_SIZE;
                const newChunk = createChunk(newZ);
                chunks.push(newChunk);
                trenchContainer.add(newChunk);
            }

            renderer.render(scene, camera);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }
    </script>
</body>
</html>
