<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Horizon: Fixed Collisions</title>
    <style>
        /* Ensure transparent background for AR passthrough */
        body { 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
        }

        /* 2D Menu Overlay */
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        #game-menu {
            background: rgba(0, 20, 40, 0.95); 
            padding: 30px; 
            border: 2px solid #0ff; 
            border-radius: 15px; 
            min-width: 300px;
            text-align: center;
            pointer-events: auto; 
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
        }

        h1 { margin: 0 0 15px; color: #0ff; text-shadow: 0 0 10px #0ff; letter-spacing: 2px; }
        p { margin: 8px 0; font-size: 1.1em; }
        .highlight { color: #f0f; font-weight: bold; }
        .small { font-size: 0.8em; color: #aaa; margin-top: 15px; }

        /* CSS to hide menu when AR is active */
        body.xr-active #ui-container { display: none; }
        body.xr-active { background-color: transparent !important; }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="game-menu">
            <h1>NEON HORIZON</h1>
            <p>Stick L/R: <span class="highlight">Move</span></p>
            <p>Triggers: <span class="highlight">Fire</span></p>
            <div class="small">
                Survive 10 Levels.<br>
                Bosses appear at 60s.<br>
                Press 'START AR' to enter.
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

        // --- CONFIGURATION ---
        const WORLD_SCALE = 0.06;
        const SCROLL_SPEED = 15.0;
        const VIEW_TILT = 30 * (Math.PI / 180);
        
        // Spawn distances relative to the World Root
        const SPAWN_Z = -45; 
        const BOSS_SPAWN_Z = -60; // Boss is further back
        const PLAYER_Z = 8;
        const FIELD_WIDTH = 14;
        
        // --- SHARED GEOMETRIES (Reused to prevent freeze) ---
        const geoms = {
            bullet: new THREE.IcosahedronGeometry(0.5, 0), // Nice visible bullets
            particle: new THREE.BoxGeometry(0.25, 0.25, 0.25),
            tower: new THREE.BoxGeometry(1.5, 1, 1.5), 
            enemyDiamond: new THREE.OctahedronGeometry(1.5),
            enemySaucer: new THREE.CylinderGeometry(1.5, 1.5, 0.5, 8),
            bossCube: new THREE.BoxGeometry(6, 4, 4),
            bossSphere: new THREE.IcosahedronGeometry(4, 1)
        };

        // --- SHARED MATERIALS ---
        const mats = {
            black: new THREE.MeshBasicMaterial({ color: 0x000000 }),
            wirePlayer: new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }),
            wireEnemy: new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 2 }),
            wireTower: new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 }),
            wireBoss: new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 }),
            bulletPlayer: new THREE.MeshBasicMaterial({ color: 0x00ffff }),
            bulletEnemy: new THREE.MeshBasicMaterial({ color: 0xff0000 }),
            partPlayer: new THREE.MeshBasicMaterial({ color: 0x00ffff }),
            partEnemy: new THREE.MeshBasicMaterial({ color: 0xff00ff })
        };

        // --- GLOBALS ---
        let camera, scene, renderer, worldRoot;
        let clock = new THREE.Clock();
        let hudTexture, hudContext;
        
        // Game State
        let gameState = "WAITING"; 
        let score = 0;
        let lives = 10;
        let currentLevel = 1;
        let levelTimer = 0;
        let isBossPhase = false;
        let invulnTimer = 0;
        
        // Entity Arrays
        let playerGroup;
        let terrainGeo;
        const enemies = [];
        const towers = [];
        const bullets = [];
        const particles = [];
        let currentBoss = null;

        // Reusable Temps for Collision to reduce GC
        const tempVec = new THREE.Vector3();
        const tempSphere = new THREE.Sphere();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // AR Button setup with DOM Overlay Fix
            const arButton = ARButton.createButton(renderer, { 
                requiredFeatures: ['local'],
                optionalFeatures: ['local-floor', 'bounded-floor', 'dom-overlay'],
                domOverlay: { root: document.body }
            });
            document.body.appendChild(arButton);

            // Handle AR session events
            renderer.xr.addEventListener('sessionstart', () => {
                document.body.classList.add('xr-active');
                resetGameFull();
            });
            renderer.xr.addEventListener('sessionend', () => {
                document.body.classList.remove('xr-active');
            });

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            setupWorld();
            setupControllers();
            
            // Handle resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setupWorld() {
            worldRoot = new THREE.Group();
            // Position: Waist height, looking down (+30 deg)
            worldRoot.position.set(0, -0.5, -1.5); 
            worldRoot.rotation.x = VIEW_TILT;
            worldRoot.scale.setScalar(WORLD_SCALE); 
            scene.add(worldRoot);

            // Terrain
            terrainGeo = new THREE.PlaneGeometry(FIELD_WIDTH + 10, 80, 30, 80);
            terrainGeo.rotateX(-Math.PI / 2);
            
            const tSolid = new THREE.Mesh(terrainGeo, mats.black);
            const tWire = new THREE.Mesh(terrainGeo, new THREE.MeshBasicMaterial({ 
                color: 0x00ff00, wireframe: true, transparent: true, opacity: 0.3 
            }));
            worldRoot.add(tSolid);
            worldRoot.add(tWire);

            // Player
            createPlayer();
            
            // HUD
            createHUD();
            updateHUD();
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            
            const geom = new THREE.ConeGeometry(1, 3, 4, 1, true);
            geom.rotateX(Math.PI/2);
            const line = new THREE.LineSegments(new THREE.WireframeGeometry(geom), mats.wirePlayer);
            const solid = new THREE.Mesh(geom, mats.black);
            
            playerGroup.add(solid);
            playerGroup.add(line);
            
            // Wings
            const wingGeom = new THREE.BufferGeometry();
            const verts = new Float32Array([0,0,0, 2,0,1, 0,0,1.5,  0,0,0, -2,0,1, 0,0,1.5]);
            wingGeom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            playerGroup.add(new THREE.Line(wingGeom, mats.wirePlayer));

            // Bounding Box helper
            playerGroup.userData.box = new THREE.Box3();
            worldRoot.add(playerGroup);
        }

        function setupControllers() {
            const c1 = renderer.xr.getController(0);
            const c2 = renderer.xr.getController(1);
            
            const onSelect = () => {
                if (gameState === "PLAYING") firePlayerMissile();
                else if (gameState === "GAME_OVER" || gameState === "WAITING") resetGameFull();
            };
            
            c1.addEventListener('selectstart', onSelect);
            c2.addEventListener('selectstart', onSelect);
            scene.add(c1); scene.add(c2);
        }

        // --- GAME LOGIC ---

        function resetGameFull() {
            // Cleanup
            [...enemies, ...towers, ...bullets, ...particles].forEach(e => worldRoot.remove(e.mesh));
            enemies.length = 0; towers.length = 0; bullets.length = 0; particles.length = 0;
            if (currentBoss) { worldRoot.remove(currentBoss.mesh); currentBoss = null; }

            score = 0;
            lives = 10;
            currentLevel = 1;
            startLevel(1);
            
            gameState = "PLAYING";
            playerGroup.visible = true;
            playerGroup.position.set(0, 5, PLAYER_Z);
            invulnTimer = 0;
            updateHUD();
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            if (currentLevel > 10) currentLevel = 1; 
            levelTimer = 0;
            isBossPhase = false;
            if (currentBoss) { worldRoot.remove(currentBoss.mesh); currentBoss = null; }
            updateHUD();
        }

        function spawnBoss() {
            if (currentBoss) return;
            isBossPhase = true;
            
            const group = new THREE.Group();
            let geom, wireMat = mats.wireBoss;
            
            // Level 2 = Skull/Sphere Boss, Others = Block Boss
            if (currentLevel === 2) {
                geom = geoms.bossSphere;
            } else {
                geom = geoms.bossCube;
            }

            const solid = new THREE.Mesh(geom, mats.black);
            const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geom), wireMat);
            group.add(solid, wire);
            
            // FIX: Boss spawns further away and higher up
            group.position.set(0, 12, BOSS_SPAWN_Z);
            worldRoot.add(group);

            currentBoss = {
                mesh: group,
                hp: 20, // Harder boss
                nextFire: 0,
                box: new THREE.Box3()
            };
            updateHUD();
        }

        function spawnEnemy() {
            // Use different geometry for Level 2
            let geom = (currentLevel === 2) ? geoms.enemySaucer : geoms.enemyDiamond;
            
            const group = new THREE.Group();
            group.add(new THREE.Mesh(geom, mats.black));
            group.add(new THREE.LineSegments(new THREE.WireframeGeometry(geom), mats.wireEnemy));
            
            const posX = (Math.random() - 0.5) * 10;
            group.position.set(posX, 0, SPAWN_Z);
            worldRoot.add(group);
            
            enemies.push({
                mesh: group,
                box: new THREE.Box3(),
                initialX: posX,
                phase: Math.random() * 100,
                nextFire: Math.random() * 2
            });
        }

        function spawnTower() {
            const height = 3 + Math.random() * 4;
            const solid = new THREE.Mesh(geoms.tower, mats.black);
            const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geoms.tower), mats.wireTower);
            
            solid.scale.y = height; solid.position.y = height / 2;
            wire.scale.y = height; wire.position.y = height / 2;

            const group = new THREE.Group();
            group.add(solid, wire);
            
            group.position.set((Math.random() - 0.5) * 14, 0, SPAWN_Z);
            worldRoot.add(group);
            
            towers.push({ mesh: group, box: new THREE.Box3() });
        }

        function firePlayerMissile() {
            if (!playerGroup.visible) return;
            if (bullets.filter(b => b.isPlayer).length >= 5) return;

            const mesh = new THREE.Mesh(geoms.bullet, mats.bulletPlayer);
            mesh.position.copy(playerGroup.position);
            mesh.position.z -= 2.0; 
            
            worldRoot.add(mesh);
            bullets.push({
                mesh: mesh,
                velocity: new THREE.Vector3(0, 0, -40),
                isPlayer: true
            });
            
            spawnParticleExplosion(playerGroup.position, true, 5); 
        }

        function fireEnemyBullet(pos, count) {
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geoms.bullet, mats.bulletEnemy);
                mesh.position.copy(pos);
                mesh.position.z += 2;
                
                const vx = count > 1 ? (Math.random() - 0.5) * 20 : 0; // Spread
                
                worldRoot.add(mesh);
                bullets.push({
                    mesh: mesh,
                    velocity: new THREE.Vector3(vx, 0, 25),
                    isPlayer: false
                });
            }
        }

        // --- UPDATE LOOP ---

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const dt = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            if (gameState === "PLAYING") {
                levelTimer += dt;

                if (levelTimer > 60 && !isBossPhase) spawnBoss();
                if (levelTimer > 80) startLevel(currentLevel + 1);

                updatePlayer(dt, time);
                updateEntities(dt, time);
                checkCollisions();
            }
            
            updateParticles(dt);
            updateTerrain(time);
            
            renderer.render(scene, camera);
        }

        function updatePlayer(dt, time) {
            if (invulnTimer > 0) {
                invulnTimer -= dt;
                playerGroup.visible = Math.floor(time * 20) % 2 === 0;
                if (invulnTimer <= 0) { playerGroup.visible = true; updateHUD(); }
            }

            const session = renderer.xr.getSession();
            let dx = 0;
            if (session && session.inputSources) {
                for (const s of session.inputSources) {
                    if (s.gamepad && s.gamepad.axes.length > 2) dx += s.gamepad.axes[2];
                }
            }
            if (Math.abs(dx) > 0.1) playerGroup.position.x += dx * 10 * dt;
            playerGroup.position.x = Math.max(-7, Math.min(7, playerGroup.position.x));

            const h = getTerrainHeight(playerGroup.position.x, playerGroup.position.z, time);
            playerGroup.position.y = h + 4;
            playerGroup.rotation.z = -dx * 0.5;
        }

        function updateEntities(dt, time) {
            const move = SCROLL_SPEED * dt;
            
            // Spawning
            if (!isBossPhase && gameState === "PLAYING") {
                const maxE = 2 + currentLevel; 
                const maxT = 3 + currentLevel;
                if (enemies.length < maxE && Math.random() < 0.02) spawnEnemy();
                if (towers.length < maxT && Math.random() < 0.02) spawnTower();
            }

            // Boss
            if (currentBoss) {
                const b = currentBoss.mesh;
                // Approach
                b.position.z += (BOSS_SPAWN_Z + 20 - b.position.z) * dt * 0.5; 
                b.position.x = Math.sin(time) * 6;
                b.position.y = getTerrainHeight(b.position.x, b.position.z, time) + 12; // High up
                
                if (time > currentBoss.nextFire) {
                    fireEnemyBullet(b.position, 2 + currentLevel);
                    currentBoss.nextFire = time + 1.5;
                }
            }

            // Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.mesh.position.z += move;
                e.mesh.position.x = e.initialX + Math.sin(time * 2 + e.phase) * 3;
                e.mesh.position.y = getTerrainHeight(e.mesh.position.x, e.mesh.position.z, time) + 3;
                
                if (time > e.nextFire && e.mesh.position.z < PLAYER_Z - 5) {
                    fireEnemyBullet(e.mesh.position, 1);
                    e.nextFire = time + 2;
                }
                if (e.mesh.position.z > 15) { worldRoot.remove(e.mesh); enemies.splice(i, 1); }
            }

            // Towers
            for (let i = towers.length - 1; i >= 0; i--) {
                const t = towers[i];
                t.mesh.position.z += move;
                t.mesh.position.y = getTerrainHeight(t.mesh.position.x, t.mesh.position.z, time);
                if (t.mesh.position.z > 15) { worldRoot.remove(t.mesh); towers.splice(i, 1); }
            }

            // Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.velocity, dt);
                b.mesh.position.y = getTerrainHeight(b.mesh.position.x, b.mesh.position.z, time) + 1.5;
                if (b.mesh.position.z < BOSS_SPAWN_Z - 5 || b.mesh.position.z > 20) {
                    worldRoot.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        // --- COLLISION DETECTION (FIXED) ---
        function checkCollisions() {
            if (invulnTimer > 0 || !playerGroup.visible) return;

            // Update All Matrices First
            worldRoot.updateMatrixWorld(true);

            // 1. Calculate Player World Box
            playerGroup.userData.box.setFromObject(playerGroup);
            const pSize = new THREE.Vector3(); playerGroup.userData.box.getSize(pSize);
            playerGroup.userData.box.expandByScalar(-Math.min(pSize.x, pSize.y, pSize.z) * 0.2); // Shrink
            const pBox = playerGroup.userData.box;

            // 2. Player vs Towers
            for (const t of towers) {
                t.box.setFromObject(t.mesh);
                if (pBox.intersectsBox(t.box)) return playerHit();
            }
            
            // 3. Player vs Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].box.setFromObject(enemies[i].mesh);
                if (pBox.intersectsBox(enemies[i].box)) {
                    spawnParticleExplosion(enemies[i].mesh.getWorldPosition(tempVec), false, 20);
                    worldRoot.remove(enemies[i].mesh); enemies.splice(i, 1);
                    return playerHit();
                }
            }

            // 4. Player vs Boss
            if (currentBoss) {
                currentBoss.box.setFromObject(currentBoss.mesh);
                if (pBox.intersectsBox(currentBoss.box)) return playerHit();
            }

            // 5. Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                let hit = false;
                
                // Calculate Bullet World Sphere
                b.mesh.getWorldPosition(tempVec);
                tempSphere.center.copy(tempVec);
                tempSphere.radius = 0.5 * WORLD_SCALE * 10; // Approximate radius in world units

                // Hit Tower?
                for (const t of towers) {
                    if (t.box.intersectsSphere(tempSphere)) { hit = true; break; }
                }

                if (!hit) {
                    if (b.isPlayer) {
                        // Hit Enemy?
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            if (enemies[j].box.intersectsSphere(tempSphere)) {
                                spawnParticleExplosion(enemies[j].mesh.getWorldPosition(tempVec), false, 10);
                                worldRoot.remove(enemies[j].mesh); enemies.splice(j, 1);
                                score += 10; updateHUD(); hit = true; break;
                            }
                        }
                        // Hit Boss?
                        if (!hit && currentBoss && currentBoss.box.intersectsSphere(tempSphere)) {
                            spawnParticleExplosion(b.mesh.getWorldPosition(tempVec), false, 5);
                            currentBoss.hp--;
                            if (currentBoss.hp <= 0) {
                                spawnParticleExplosion(currentBoss.mesh.getWorldPosition(tempVec), false, 50);
                                worldRoot.remove(currentBoss.mesh); currentBoss = null;
                                score += currentLevel * 100; 
                                startLevel(currentLevel + 1);
                            }
                            hit = true;
                        }
                    } else {
                        // Hit Player?
                        if (pBox.intersectsSphere(tempSphere)) {
                            playerHit(); hit = true;
                        }
                    }
                }

                if (hit) {
                    worldRoot.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        function playerHit() {
            spawnParticleExplosion(playerGroup.getWorldPosition(tempVec), true, 30);
            lives--;
            playerGroup.visible = false;
            
            // Clear threats
            towers.forEach(t => { if(t.mesh.position.z > PLAYER_Z - 10) t.mesh.position.z = -200; });
            enemies.forEach(e => { if(e.mesh.position.z > PLAYER_Z - 10) e.mesh.position.z = -200; });
            bullets.forEach(b => worldRoot.remove(b.mesh));
            bullets.length = 0;

            if (lives <= 0) gameState = "GAME_OVER";
            else {
                playerGroup.position.set(0, 5, PLAYER_Z);
                invulnTimer = 2.0;
            }
            updateHUD();
        }

        function spawnParticleExplosion(pos, isCyan, count) {
            const mat = isCyan ? mats.partPlayer : mats.partEnemy;
            // Limit active particles to prevent freeze
            if (particles.length > 100) { worldRoot.remove(particles[0].mesh); particles.shift(); }

            // Convert World Position 'pos' back to Local position for adding to worldRoot
            const localPos = worldRoot.worldToLocal(pos.clone());

            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geoms.particle, mat);
                mesh.position.copy(localPos);
                mesh.position.add(new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2));
                
                worldRoot.add(mesh);
                particles.push({
                    mesh: mesh,
                    life: 1.0,
                    vel: new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10+5, (Math.random()-0.5)*10)
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt * 2;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.vel.y -= 9.8 * dt;
                p.mesh.rotation.x += dt*5;
                p.mesh.scale.setScalar(p.life);
                if (p.life <= 0) { worldRoot.remove(p.mesh); particles.splice(i, 1); }
            }
        }

        function getTerrainHeight(x, z, t) {
            const zOff = z - (t * SCROLL_SPEED);
            return (Math.sin(x * 0.3) * 2.0) + (Math.sin(zOff * 0.2) * 3.0) + (Math.cos(zOff*0.5 + x*0.5)) - 4.0;
        }

        function updateTerrain(t) {
            const pos = terrainGeo.attributes.position;
            const v = new THREE.Vector3();
            for(let i=0; i<pos.count; i++){
                v.fromBufferAttribute(pos, i);
                v.y = getTerrainHeight(v.x, v.z, t);
                pos.setY(i, v.y);
            }
            pos.needsUpdate = true;
        }

        function createHUD() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            hudContext = canvas.getContext('2d');
            hudTexture = new THREE.CanvasTexture(canvas);
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(15, 7.5), new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true }));
            mesh.position.set(0, 10, SPAWN_Z);
            mesh.rotation.x = -20 * Math.PI/180;
            worldRoot.add(mesh);
        }

        function updateHUD() {
            const ctx = hudContext;
            ctx.clearRect(0,0,512,256);
            ctx.fillStyle = "rgba(0,20,40,0.8)"; ctx.fillRect(0,0,512,256);
            ctx.strokeStyle = "#0ff"; ctx.lineWidth=4; ctx.strokeRect(0,0,512,256);
            ctx.textAlign="center"; ctx.fillStyle="#fff";
            
            if (gameState === "PLAYING") {
                ctx.font="bold 40px Courier"; ctx.fillText(`LVL ${currentLevel} | SCORE ${score}`, 256, 60);
                ctx.fillStyle = isBossPhase ? "#f00" : "#0f0";
                ctx.fillText(isBossPhase ? "BOSS FIGHT" : `WAVE TIME: ${Math.ceil(60 - levelTimer)}`, 256, 120);
                ctx.fillStyle = invulnTimer > 0 ? "#ff0" : (lives<=3?"#f00":"#0f0");
                ctx.fillText(`LIVES: ${lives}`, 256, 180);
            } else if (gameState === "GAME_OVER") {
                ctx.fillStyle="#f00"; ctx.font="bold 60px Courier"; ctx.fillText("GAME OVER", 256, 128);
            } else {
                ctx.font="40px Courier"; ctx.fillText("READY", 256, 128);
            }
            hudTexture.needsUpdate = true;
        }
    </script>
</body>
</html>
