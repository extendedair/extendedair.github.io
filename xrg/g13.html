<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Horizon: Level Loop</title>
    <style>
        /* 
           1. RESET: Ensure body occupies full screen and is black by default for 2D mode.
        */
        body { 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
        }

        /* 
           2. UI OVERLAY: Centered styling for the start screen. 
        */
        #ui-layer {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
            z-index: 10;
        }

        #game-menu {
            background: rgba(0, 20, 40, 0.9); 
            padding: 40px; 
            border: 2px solid #0ff; 
            border-radius: 10px; 
            min-width: 320px;
            text-align: center;
            pointer-events: auto; /* Re-enable clicks for this box */
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        h1 { margin: 0 0 20px; font-size: 1.8em; color: #0ff; text-shadow: 0 0 10px #0ff; }
        p { margin: 10px 0; font-size: 1.1em; line-height: 1.6em; }
        .highlight { color: #f0f; font-weight: bold; }
        #status-text { margin-top: 20px; color: #888; font-size: 0.9em; }

        /* 
           3. AR MODE FIX: When class 'ar-active' is added to body, ensure transparency
              to prevent the "Dark Rectangle" shadow in the headset.
        */
        body.ar-active {
            background-color: transparent !important;
        }
        body.ar-active #ui-layer {
            display: none !important; /* Remove 2D UI entirely in AR */
        }
    </style>
</head>
<body>

    <!-- 2D User Interface -->
    <div id="ui-layer">
        <div id="game-menu">
            <h1>NEON HORIZON</h1>
            <p>Stick L/R: <span class="highlight">Move</span></p>
            <p>Triggers: <span class="highlight">Fire</span></p>
            <div style="text-align: left; font-size: 0.8em; margin: 15px 0; color: #ccc;">
                - Survive 10 Levels<br>
                - Defeat Bosses every 60s<br>
                - Avoid Towers & Bullets
            </div>
            <p id="status-text">Click 'START AR' below to initialize.</p>
        </div>
    </div>

    <!-- Game Modules -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

        // =============================================================================
        // 1. CONFIGURATION & CONSTANTS
        // =============================================================================
        
        const WORLD_SCALE = 0.06;           // Scales the world to tabletop size
        const SCROLL_SPEED = 15.0;          // Speed of terrain movement
        const VIEW_TILT = 30 * (Math.PI/180); // +30 degrees (looking down hill)
        
        const FIELD_WIDTH = 14;             // Playable width
        const SPAWN_Z = -45;                // Z-depth where enemies spawn
        const PLAYER_Z = 8;                 // Player Z position
        
        // Level Settings
        const LEVEL_DURATION_WAVE = 60;     // Seconds of normal enemies
        const LEVEL_DURATION_BOSS = 20;     // Seconds of boss fight
        const TOTAL_LEVELS = 10;
        
        // Base Entities (Will scale with level)
        const BASE_ENEMIES = 2;
        const BASE_TOWERS = 3;
        
        // Materials (Reused for performance)
        const matBlack = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const matWirePlayer = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });
        const matWireEnemy = new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 2 });
        const matWireTower = new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 });
        const matWireBoss = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 });
        
        const matBulletPlayer = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const matBulletEnemy = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        
        const matPartPlayer = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const matPartEnemy = new THREE.MeshBasicMaterial({ color: 0xff00ff });

        // =============================================================================
        // 2. GLOBAL STATE VARIABLES
        // =============================================================================
        
        let camera, scene, renderer, worldRoot;
        let clock = new THREE.Clock();
        
        // Game Lifecycle
        // States: "WAITING" (Menu), "PLAYING" (Action), "GAME_OVER" (0 Lives)
        let gameState = "WAITING"; 
        
        // Stats
        let score = 0;
        let lives = 10; // Start with 10 lives per request
        
        // Level Progression
        let currentLevel = 1;
        let levelTimer = 0.0;
        let isBossPhase = false;
        
        // Player Logic
        let playerGroup;
        let playerVelocity = new THREE.Vector3();
        let invulnTimer = 0; // Timer for shield after death
        
        // Entities Arrays
        let terrainGeo, terrainMesh;
        const enemies = [];
        const towers = [];
        const bullets = [];
        const particles = [];
        let currentBoss = null; // Stores the boss object if active

        // HUD
        let hudTexture, hudContext, hudMesh;

        // =============================================================================
        // 3. INITIALIZATION
        // =============================================================================

        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // AR Button Setup
            const arButton = ARButton.createButton(renderer, { 
                requiredFeatures: ['local'],
                optionalFeatures: ['local-floor', 'bounded-floor']
            });
            document.body.appendChild(arButton);

            // Event Listeners for AR Session
            renderer.xr.addEventListener('sessionstart', onSessionStart);
            renderer.xr.addEventListener('sessionend', onSessionEnd);

            // Lighting (Basic)
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            // Setup Game Components
            setupGameWorld();
            setupControllers();
            window.addEventListener('resize', onWindowResize);
        }

        // Handle UI hiding for the "Dark Rectangle" fix
        function onSessionStart() {
            document.body.classList.add('ar-active');
        }

        function onSessionEnd() {
            document.body.classList.remove('ar-active');
        }

        // =============================================================================
        // 4. WORLD & ENTITY CREATION
        // =============================================================================

        function setupGameWorld() {
            worldRoot = new THREE.Group();
            
            // Position world at waist height, slightly forward, tilted down
            worldRoot.position.set(0, -0.5, -1.5); 
            worldRoot.rotation.x = VIEW_TILT;
            worldRoot.scale.setScalar(WORLD_SCALE); 
            scene.add(worldRoot);

            // --- Terrain ---
            // 30 segments width, 80 segments depth for smooth rolling
            terrainGeo = new THREE.PlaneGeometry(FIELD_WIDTH + 10, 80, 30, 80);
            terrainGeo.rotateX(-Math.PI / 2); // Lay flat
            
            // Solid Black Mesh (occludes objects behind hills)
            const terrainSolid = new THREE.Mesh(terrainGeo, matBlack);
            // Wireframe Overlay
            const terrainWire = new THREE.Mesh(terrainGeo, new THREE.MeshBasicMaterial({ 
                color: 0x00ff00, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.3 
            }));
            
            terrainMesh = new THREE.Group();
            terrainMesh.add(terrainSolid);
            terrainMesh.add(terrainWire);
            worldRoot.add(terrainMesh);

            // --- Player ---
            createPlayer();

            // --- HUD ---
            createHUD();

            // Initial Reset
            resetGameFull();
            gameState = "WAITING"; 
            updateHUD();
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            
            // 1. Visuals: Cone body + Wings
            const geom = new THREE.ConeGeometry(1, 3, 4, 1, true);
            geom.rotateX(Math.PI/2); 
            const edges = new THREE.WireframeGeometry(geom);
            const line = new THREE.LineSegments(edges, matWirePlayer);
            
            const wingGeom = new THREE.BufferGeometry();
            const wingVerts = new Float32Array([
                0, 0, 0,   2, 0, 1,   0, 0, 1.5,
                0, 0, 0,  -2, 0, 1,   0, 0, 1.5
            ]);
            wingGeom.setAttribute('position', new THREE.BufferAttribute(wingVerts, 3));
            const wingMesh = new THREE.Line(wingGeom, matWirePlayer);
            
            // Solid interior (blocks seeing terrain through ship)
            const solidCone = new THREE.Mesh(geom, matBlack);

            playerGroup.add(solidCone);
            playerGroup.add(line);
            playerGroup.add(wingMesh);

            // 2. Physics Data
            playerGroup.userData = {
                colliderBox: new THREE.Box3()
            };

            worldRoot.add(playerGroup);
        }

        function setupControllers() {
            const controller1 = renderer.xr.getController(0);
            const controller2 = renderer.xr.getController(1);

            // Trigger Listener
            const onTrigger = () => handleTriggerInput();
            controller1.addEventListener('selectstart', onTrigger);
            controller2.addEventListener('selectstart', onTrigger);

            scene.add(controller1);
            scene.add(controller2);
        }

        function createHUD() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            hudContext = canvas.getContext('2d');
            hudTexture = new THREE.CanvasTexture(canvas);
            
            const mat = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
            const geo = new THREE.PlaneGeometry(15, 7.5);
            hudMesh = new THREE.Mesh(geo, mat);
            
            // Place HUD floating in the distance
            hudMesh.position.set(0, 10, SPAWN_Z);
            hudMesh.rotation.x = -20 * (Math.PI/180); 
            worldRoot.add(hudMesh);
        }

        // =============================================================================
        // 5. GAME LOGIC: LEVELS & SPAWNING
        // =============================================================================

        function handleTriggerInput() {
            if (gameState === "WAITING" || gameState === "GAME_OVER") {
                resetGameFull();
            } else if (gameState === "PLAYING") {
                firePlayerMissile();
            }
        }

        function resetGameFull() {
            score = 0;
            lives = 10;
            currentLevel = 1;
            startLevel(1);
            gameState = "PLAYING";
            
            // Reset Player
            playerGroup.visible = true;
            playerGroup.position.set(0, 5, PLAYER_Z);
            invulnTimer = 0;

            updateHUD();
        }

        function startLevel(levelNum) {
            currentLevel = levelNum;
            levelTimer = 0;
            isBossPhase = false;
            
            // Clear existing entities
            clearEntities();

            // Calculate Difficulty Caps based on level
            // Level 1: 3 enemies, Level 10: 12 enemies
            // Level 1: 4 towers, Level 10: 13 towers
            // Caps handled in update loop logic
            
            if (levelNum > TOTAL_LEVELS) {
                // Loop back (New Game+ style) or cap. Request said "10 level loop".
                // We will loop back to 1 but keep score.
                currentLevel = 1;
            }
            updateHUD();
        }

        function clearEntities() {
            // Remove meshes from scene
            [...enemies, ...towers, ...bullets, ...particles].forEach(e => worldRoot.remove(e.mesh));
            if (currentBoss) worldRoot.remove(currentBoss.mesh);
            
            // Clear arrays
            enemies.length = 0;
            towers.length = 0;
            bullets.length = 0;
            particles.length = 0;
            currentBoss = null;
        }

        // --- FACTORY FUNCTIONS ---

        // Get Enemy Geometry based on Level
        function createEnemyMesh(level) {
            let geom;
            // Level 2 = Hexagonal Saucer
            if (level === 2) {
                geom = new THREE.CylinderGeometry(1.5, 1.5, 0.5, 6); 
                geom.rotateX(Math.PI / 2);
            } else {
                // Level 1 & 3-10 = Diamond (Octahedron)
                geom = new THREE.OctahedronGeometry(1.5);
            }
            
            const solid = new THREE.Mesh(geom, matBlack);
            const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geom), matWireEnemy);
            const group = new THREE.Group();
            group.add(solid);
            group.add(wire);
            return group;
        }

        // Get Boss Geometry based on Level
        function createBossMesh(level) {
            const group = new THREE.Group();

            if (level === 2) {
                // SKULL BOSS
                const headGeom = new THREE.IcosahedronGeometry(4, 1);
                const headWire = new THREE.LineSegments(new THREE.WireframeGeometry(headGeom), matWireBoss);
                const headSolid = new THREE.Mesh(headGeom, matBlack);
                
                const jawGeom = new THREE.BoxGeometry(3, 2, 4);
                jawGeom.translate(0, -3, 1);
                const jawWire = new THREE.LineSegments(new THREE.WireframeGeometry(jawGeom), matWireBoss);
                const jawSolid = new THREE.Mesh(jawGeom, matBlack);

                group.add(headSolid, headWire, jawSolid, jawWire);

            } else {
                // CRAB BOSS (Level 1, 3-10)
                const bodyGeom = new THREE.BoxGeometry(8, 3, 5);
                const bodyWire = new THREE.LineSegments(new THREE.WireframeGeometry(bodyGeom), matWireBoss);
                const bodySolid = new THREE.Mesh(bodyGeom, matBlack);
                
                group.add(bodySolid, bodyWire);

                // Legs
                const legGeom = new THREE.CylinderGeometry(0.5, 0.5, 6);
                const legWire = new THREE.WireframeGeometry(legGeom);
                
                [-3, 3].forEach(x => {
                    const l = new THREE.LineSegments(legWire, matWireBoss);
                    l.position.set(x, -2, 0);
                    l.rotation.z = x > 0 ? -0.5 : 0.5;
                    group.add(l);
                });
            }
            return group;
        }

        function spawnBoss() {
            if (currentBoss) return; // Already exists

            const mesh = createBossMesh(currentLevel);
            mesh.position.set(0, 5, SPAWN_Z); // Start far back
            
            worldRoot.add(mesh);
            
            currentBoss = {
                mesh: mesh,
                hp: 10,
                maxHp: 10,
                colliderBox: new THREE.Box3(),
                movePhase: 0,
                nextFire: 0
            };
            
            isBossPhase = true;
            updateHUD(); // Show BOSS ALERT
        }

        function spawnNormalEnemy() {
            const mesh = createEnemyMesh(currentLevel);
            const posX = (Math.random() - 0.5) * (FIELD_WIDTH - 4);
            mesh.position.set(posX, 0, SPAWN_Z); // Y set in update loop

            worldRoot.add(mesh);

            enemies.push({
                mesh: mesh,
                colliderBox: new THREE.Box3(),
                initialX: posX,
                phase: Math.random() * 100,
                nextFire: Math.random() * 2 // Random initial delay
            });
        }

        function spawnTower() {
            const height = 3 + Math.random() * 4;
            const width = 1.5;
            const geom = new THREE.BoxGeometry(width, height, width);
            geom.translate(0, height/2, 0); // Pivot at bottom

            const solid = new THREE.Mesh(geom, matBlack);
            const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geom), matWireTower);
            const group = new THREE.Group();
            group.add(solid);
            group.add(wire);

            const posX = (Math.random() - 0.5) * FIELD_WIDTH;
            group.position.set(posX, 0, SPAWN_Z);

            worldRoot.add(group);
            towers.push({ mesh: group, colliderBox: new THREE.Box3() });
        }

        // =============================================================================
        // 6. COMBAT & PHYSICS
        // =============================================================================

        function firePlayerMissile() {
            if (!playerGroup.visible) return; // Cannot fire if dead/respawning

            // Limit bullets
            if (bullets.filter(b => b.isPlayer).length >= MAX_PLAYER_BULLETS) return;

            const geom = new THREE.IcosahedronGeometry(0.3);
            const mesh = new THREE.Mesh(geom, matBulletPlayer);
            mesh.position.copy(playerGroup.position);
            mesh.position.z -= 1.5;

            worldRoot.add(mesh);
            bullets.push({
                mesh: mesh,
                colliderSphere: new THREE.Sphere(), // Use Sphere for bullets
                velocity: new THREE.Vector3(0, 0, -40),
                isPlayer: true
            });
        }

        function fireEnemyBullet(sourcePos, count = 1) {
            // For boss shotgun spread, we might call this with count > 1
            for (let i = 0; i < count; i++) {
                const geom = new THREE.SphereGeometry(0.4);
                const mesh = new THREE.Mesh(geom, matBulletEnemy);
                mesh.position.copy(sourcePos);
                mesh.position.z += 2;

                // Spread logic
                const spreadX = count > 1 ? (Math.random() - 0.5) * 10 : 0;
                
                worldRoot.add(mesh);
                bullets.push({
                    mesh: mesh,
                    colliderSphere: new THREE.Sphere(),
                    velocity: new THREE.Vector3(spreadX, 0, 25), // Move towards player
                    isPlayer: false
                });
            }
        }

        function playerHit() {
            // Spawn Particles
            spawnParticles(playerGroup.position, true);
            
            lives--;
            playerGroup.visible = false; // Hide ship

            if (lives <= 0) {
                gameState = "GAME_OVER";
            } else {
                // Instant Respawn logic
                playerGroup.position.set(0, 5, PLAYER_Z);
                invulnTimer = 2.0; // 2 seconds shield
                
                // Clear threats in immediate vicinity so you don't die instantly
                const safeZone = PLAYER_Z - 15;
                towers.forEach(t => { if(t.mesh.position.z > safeZone) t.mesh.position.z = -200; });
                enemies.forEach(e => { if(e.mesh.position.z > safeZone) e.mesh.position.z = -200; });
                bullets.forEach(b => worldRoot.remove(b.mesh));
                bullets.length = 0;
            }
            updateHUD();
        }

        function checkCollisions() {
            if (invulnTimer > 0 || !playerGroup.visible) return;

            // Update Player Bounding Box
            playerGroup.updateMatrixWorld(true);
            playerGroup.userData.colliderBox.setFromObject(playerGroup);
            // Shrink hitbox by 20% for fairness
            const s = new THREE.Vector3();
            playerGroup.userData.colliderBox.getSize(s);
            playerGroup.userData.colliderBox.expandByScalar(-Math.min(s.x, s.y, s.z) * 0.2);
            const playerBox = playerGroup.userData.colliderBox;

            // 1. Player vs Towers (Crash)
            for (let t of towers) {
                t.mesh.updateMatrixWorld(true);
                t.colliderBox.setFromObject(t.mesh);
                if (playerBox.intersectsBox(t.colliderBox)) {
                    playerHit();
                    return;
                }
            }

            // 2. Player vs Enemies (Crash)
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.mesh.updateMatrixWorld(true);
                e.colliderBox.setFromObject(e.mesh);
                if (playerBox.intersectsBox(e.colliderBox)) {
                    playerHit();
                    destroyEnemy(i);
                    return;
                }
            }

            // 3. Player vs Boss (Crash)
            if (currentBoss) {
                currentBoss.mesh.updateMatrixWorld(true);
                currentBoss.colliderBox.setFromObject(currentBoss.mesh);
                if (playerBox.intersectsBox(currentBoss.colliderBox)) {
                    playerHit();
                    return;
                }
            }

            // 4. Bullet Logic
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.updateMatrixWorld(true);
                // Update Bullet Sphere (radius 0.4 matches geometry)
                b.colliderSphere.center.copy(b.mesh.position);
                b.colliderSphere.radius = 0.5; // Slightly larger for hit registration

                let destroyed = false;

                // A. Bullet vs Towers (Indestructible)
                for (let t of towers) {
                    if (t.colliderBox.intersectsSphere(b.colliderSphere)) {
                        destroyed = true;
                        break;
                    }
                }

                if (!destroyed) {
                    if (b.isPlayer) {
                        // Player Bullet -> Hits Enemy?
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            if (enemies[j].colliderBox.intersectsSphere(b.colliderSphere)) {
                                spawnParticles(enemies[j].mesh.position, false);
                                destroyEnemy(j);
                                score += 10;
                                destroyed = true;
                                break;
                            }
                        }
                        // Player Bullet -> Hits Boss?
                        if (!destroyed && currentBoss) {
                            if (currentBoss.colliderBox.intersectsSphere(b.colliderSphere)) {
                                spawnParticles(b.mesh.position, false); // Spark on boss
                                currentBoss.hp--;
                                destroyed = true;
                                if (currentBoss.hp <= 0) {
                                    bossDefeated();
                                }
                            }
                        }
                    } else {
                        // Enemy Bullet -> Hits Player?
                        // Box3.intersectsSphere is robust
                        if (playerBox.intersectsSphere(b.colliderSphere)) {
                            playerHit();
                            destroyed = true;
                        }
                    }
                }

                if (destroyed) {
                    worldRoot.remove(b.mesh);
                    bullets.splice(i, 1);
                    updateHUD();
                }
            }
        }

        function bossDefeated() {
            spawnParticles(currentBoss.mesh.position, false);
            spawnParticles(currentBoss.mesh.position, false); // Big boom
            worldRoot.remove(currentBoss.mesh);
            currentBoss = null;
            
            // Bonus Score
            score += (currentLevel * 100);
            
            // Next Level
            startLevel(currentLevel + 1);
        }

        function destroyEnemy(index) {
            worldRoot.remove(enemies[index].mesh);
            enemies.splice(index, 1);
        }

        function spawnParticles(pos, isCyan) {
            const mat = isCyan ? matPartPlayer : matPartEnemy;
            const count = 15;
            const geom = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            
            for(let i=0; i<count; i++) {
                const m = new THREE.Mesh(geom, mat);
                m.position.copy(pos);
                // Random spread
                m.position.add(new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5));
                
                worldRoot.add(m);
                particles.push({
                    mesh: m,
                    velocity: new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10 + 5, (Math.random()-0.5)*10),
                    life: 1.0
                });
            }
        }

        // =============================================================================
        // 7. MAIN LOOP
        // =============================================================================

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const dt = clock.getDelta();

            // Always animate particles (explosions should look good even if paused)
            updateParticles(dt);

            if (gameState === "PLAYING") {
                levelTimer += dt;
                
                // Level Phases
                if (levelTimer >= LEVEL_DURATION_WAVE && !isBossPhase) {
                    spawnBoss();
                }
                // Boss Timeout (20s after spawn -> 80s total)
                if (levelTimer >= (LEVEL_DURATION_WAVE + LEVEL_DURATION_BOSS)) {
                    if (currentBoss) {
                        // Boss escaped
                        worldRoot.remove(currentBoss.mesh);
                        currentBoss = null;
                        startLevel(currentLevel + 1);
                    }
                }

                updatePlayer(dt);
                updateTerrain(clock.getElapsedTime());
                updateEntities(dt);
                checkCollisions();
            } 
            else if (gameState === "GAME_OVER" || gameState === "WAITING") {
                // Idle rotation of world
                worldRoot.rotation.y = Math.sin(clock.getElapsedTime() * 0.5) * 0.05;
            }

            renderer.render(scene, camera);
        }

        function updatePlayer(dt) {
            // Respawn Shield Logic
            if (invulnTimer > 0) {
                invulnTimer -= dt;
                // Flicker
                playerGroup.visible = (Math.floor(clock.getElapsedTime() * 20) % 2 === 0);
                if (invulnTimer <= 0) {
                    playerGroup.visible = true;
                    updateHUD();
                }
            }

            // Input Logic
            const session = renderer.xr.getSession();
            if (session && session.inputSources) {
                let inputX = 0;
                for (const source of session.inputSources) {
                    if (source.gamepad && source.gamepad.axes.length > 2) {
                        inputX += source.gamepad.axes[2];
                    }
                }
                // Movement
                if (Math.abs(inputX) > 0.1) {
                    playerGroup.position.x += inputX * 0.3;
                }
            }
            // Clamp
            playerGroup.position.x = Math.max(-FIELD_WIDTH/2, Math.min(FIELD_WIDTH/2, playerGroup.position.x));
            
            // Terrain Following
            const groundH = getTerrainHeight(playerGroup.position.x, playerGroup.position.z, clock.getElapsedTime());
            playerGroup.position.y = groundH + 4.0; // Hover height
            
            // Bank
            playerGroup.rotation.z = -(playerGroup.position.x - (playerGroup.position.x - 0.01)) * 10; // Simplistic banking
        }

        function updateEntities(dt) {
            const scrollMove = SCROLL_SPEED * dt;
            const totalTime = clock.getElapsedTime();

            // --- BOSS ---
            if (currentBoss) {
                // Hover in front of player
                const targetZ = PLAYER_Z - 15;
                // Lerp Z to position
                currentBoss.mesh.position.z += (targetZ - currentBoss.mesh.position.z) * dt;
                
                // Sway X
                currentBoss.mesh.position.x = Math.sin(totalTime) * 4.0;
                
                // Height
                const bossH = getTerrainHeight(currentBoss.mesh.position.x, currentBoss.mesh.position.z, totalTime);
                currentBoss.mesh.position.y = bossH + 5.0;

                // Firing
                if (totalTime > currentBoss.nextFire) {
                    // Boss firing rate roughly once per second
                    const bulletCount = BASE_ENEMIES + currentLevel; 
                    fireEnemyBullet(currentBoss.mesh.position, bulletCount);
                    currentBoss.nextFire = totalTime + 1.5;
                }
            }

            // --- ENEMIES ---
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.mesh.position.z += scrollMove;
                
                // Weaving
                e.mesh.position.x = e.initialX + Math.sin(totalTime * 2.0 + e.phase) * 3.0;
                
                // Height
                const h = getTerrainHeight(e.mesh.position.x, e.mesh.position.z, totalTime);
                e.mesh.position.y = h + 3.0;

                // Firing
                if (totalTime > e.nextFire && e.mesh.position.z < PLAYER_Z - 5) {
                    fireEnemyBullet(e.mesh.position, 1);
                    e.nextFire = totalTime + 1.5 + Math.random();
                }

                // Despawn
                if (e.mesh.position.z > PLAYER_Z + 5) {
                    destroyEnemy(i);
                }
            }

            // --- TOWERS ---
            for (let i = towers.length - 1; i >= 0; i--) {
                const t = towers[i];
                t.mesh.position.z += scrollMove;
                t.mesh.position.y = getTerrainHeight(t.mesh.position.x, t.mesh.position.z, totalTime);
                
                if (t.mesh.position.z > PLAYER_Z + 5) {
                    worldRoot.remove(t.mesh);
                    towers.splice(i, 1);
                }
            }

            // --- BULLETS ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.velocity, dt);
                
                // Terrain Hugging
                const h = getTerrainHeight(b.mesh.position.x, b.mesh.position.z, totalTime);
                b.mesh.position.y = h + 1.5;

                if (b.mesh.position.z < SPAWN_Z - 10 || b.mesh.position.z > PLAYER_Z + 10) {
                    worldRoot.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // --- SPAWNING (Only if not Boss Phase) ---
            if (!isBossPhase) {
                const maxE = BASE_ENEMIES + currentLevel;
                const maxT = BASE_TOWERS + currentLevel;
                
                if (enemies.length < maxE && Math.random() < 0.02) spawnNormalEnemy();
                if (towers.length < maxT && Math.random() < 0.02) spawnTower();
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt * 1.5;
                p.mesh.position.addScaledVector(p.velocity, dt);
                p.velocity.y -= 9.8 * dt;
                p.mesh.rotation.x += dt;
                p.mesh.scale.setScalar(p.life);
                
                if (p.life <= 0) {
                    worldRoot.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // --- UTILITIES ---

        function getTerrainHeight(x, z, t) {
            const zOffset = z - (t * SCROLL_SPEED);
            const h1 = Math.sin(x * 0.3) * 2.0;
            const h2 = Math.sin(zOffset * 0.2) * 3.0;
            const h3 = Math.cos(zOffset * 0.5 + x * 0.5) * 1.0;
            return h1 + h2 + h3 - 4.0;
        }

        function updateTerrain(time) {
            const positions = terrainGeo.attributes.position;
            const v = new THREE.Vector3();
            for (let i = 0; i < positions.count; i++) {
                v.fromBufferAttribute(positions, i);
                v.y = getTerrainHeight(v.x, v.z, time);
                positions.setY(i, v.y);
            }
            positions.needsUpdate = true;
        }

        function updateHUD() {
            const ctx = hudContext;
            const w = 512; const h = 256;
            ctx.clearRect(0, 0, w, h);
            
            // Panel
            ctx.fillStyle = "rgba(0, 20, 40, 0.8)";
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, w, h);

            // Text
            ctx.textAlign = "center";
            ctx.fillStyle = "#fff";

            if (gameState === "PLAYING") {
                ctx.font = "bold 40px Courier New";
                ctx.fillText(`LVL ${currentLevel} | SCORE: ${score}`, w/2, 60);
                
                ctx.font = "bold 30px Courier New";
                if (invulnTimer > 0) ctx.fillStyle = "#ff0";
                else ctx.fillStyle = lives <= 3 ? "#f00" : "#0f0";
                ctx.fillText(`LIVES: ${lives}`, w/2, 120);
                
                if (isBossPhase) {
                    ctx.fillStyle = "#f00";
                    ctx.font = "bold 40px Courier New";
                    ctx.fillText("! BOSS BATTLE !", w/2, 180);
                } else {
                    const timeRem = Math.max(0, Math.ceil(LEVEL_DURATION_WAVE - levelTimer));
                    ctx.fillStyle = "#aaa";
                    ctx.font = "20px Courier New";
                    ctx.fillText(`BOSS IN: ${timeRem}s`, w/2, 200);
                }

            } else if (gameState === "GAME_OVER") {
                ctx.fillStyle = "#f00";
                ctx.font = "bold 50px Courier New";
                ctx.fillText("GAME OVER", w/2, 100);
                ctx.fillStyle = "#fff";
                ctx.font = "25px Courier New";
                ctx.fillText("PULL TRIGGER TO RESTART", w/2, 170);
            } else {
                ctx.font = "bold 40px Courier New";
                ctx.fillText("READY", w/2, 130);
            }
            
            hudTexture.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
