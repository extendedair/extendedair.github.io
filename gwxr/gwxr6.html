<!DOCTYPE html>
<html lang="en">
<head>
    <title>MR Sausage Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        /* Black background for non-AR mode, essential for transparent AR */
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
    </style>
</head>
<body>

    <!-- Load Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let sausageGroup;

        init();

        function init() {
            // 1. Setup Scene
            // IMPORTANT: background must be null for Passthrough to work
            scene = new THREE.Scene();
            scene.background = null;

            // 2. Setup Camera
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 3. Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Enable WebXR
            document.body.appendChild(renderer.domElement);

            // 4. Setup AR Button
            // 'local' reference space means (0,0,0) is where the headset starts
            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['local'] });
            document.body.appendChild(arButton);

            // 5. Create Lighting
            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 5, 2);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // 6. Create the Sausage (Cell Shaded Style)
            createSausage();

            // 7. Start Loop
            renderer.setAnimationLoop(render);
        }

        function createSausage() {
            sausageGroup = new THREE.Group();

            // -- Geometry --
            // Radius: 0.15m, Length: 0.4m
            const geometry = new THREE.CapsuleGeometry(0.15, 0.4, 4, 8);

            // -- 1. The Solid Inner Color (Blue) --
            const solidMaterial = new THREE.MeshPhongMaterial({
                color: 0x0044ff,    // Blue
                shininess: 30,
                flatShading: true,  // Enhances "vector" look
                polygonOffset: true, 
                polygonOffsetFactor: 1, // Pushes color back so lines show
                polygonOffsetUnits: 1
            });
            const solidMesh = new THREE.Mesh(geometry, solidMaterial);

            // -- 2. The White Wireframe Outline --
            const wireGeometry = new THREE.WireframeGeometry(geometry);
            const wireMaterial = new THREE.LineBasicMaterial({ 
                color: 0xffffff, 
                linewidth: 2 
            });
            const wireMesh = new THREE.LineSegments(wireGeometry, wireMaterial);

            // Combine them
            solidMesh.add(wireMesh);
            sausageGroup.add(solidMesh);

            // Position: 1 meter in front (Z = -1)
            sausageGroup.position.set(0, 0, -1);
            
            scene.add(sausageGroup);
        }

        function render() {
            // Simple rotation to prove it's not frozen
            if (sausageGroup) {
                sausageGroup.rotation.x += 0.005;
                sausageGroup.rotation.y += 0.01;
            }
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
