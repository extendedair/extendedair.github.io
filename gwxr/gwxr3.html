<!DOCTYPE html>
<html lang="en">
<head>
    <title>MR Twin Stick Core</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
    </style>
</head>
<body>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        let camera, scene, renderer;
        let controller1, controller2;
        let gameGroup, levelMesh, playerMarker;
        let raycaster = new THREE.Raycaster();
        let bullets = [];
        let tempVec = new THREE.Vector3();

        // Config
        const GAME_DIST = 0.5; // Meters in front of eyes
        
        init();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            // Note: No background color set = Transparent for AR Passthrough

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 3. AR Button
            // We use 'local' reference space so 0,0,0 is where you start
            document.body.appendChild(ARButton.createButton(renderer, { 
                requiredFeatures: ['local'] 
            }));

            // 4. Lighting (Basic)
            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 2, 2);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 1));

            // 5. Game Container
            gameGroup = new THREE.Group();
            gameGroup.position.set(0, 0, -GAME_DIST); // Place 50cm in front
            scene.add(gameGroup);

            // 6. Create Level (The Shape)
            createLevel();

            // 7. Create Player Marker (The Cone)
            // Added directly to scene so it stays stable while world rotates
            const playerGeo = new THREE.ConeGeometry(0.01, 0.04, 16);
            playerGeo.rotateX(Math.PI/2); // Point Z
            const playerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            playerMarker = new THREE.Mesh(playerGeo, playerMat);
            scene.add(playerMarker);

            // 8. Controllers
            setupControllers();

            // 9. Start Loop
            renderer.setAnimationLoop(render);
        }

        function createLevel() {
            // Simple Capsule (Sausage)
            const geometry = new THREE.CapsuleGeometry(0.15, 0.4, 4, 8);
            
            // Material: Solid dark interior + Bright Wireframe so it's visible
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x001133,
                polygonOffset: true,
                polygonOffsetFactor: 1 
            });
            levelMesh = new THREE.Mesh(geometry, material);
            
            const wireframe = new THREE.LineSegments(
                new THREE.WireframeGeometry(geometry),
                new THREE.LineBasicMaterial({ color: 0x00aaff })
            );
            levelMesh.add(wireframe);
            gameGroup.add(levelMesh);
        }

        function setupControllers() {
            // Controller 1 (Left usually)
            controller1 = renderer.xr.getController(0);
            scene.add(controller1);

            // Controller 2 (Right usually)
            controller2 = renderer.xr.getController(1);
            // Add Listener for Trigger to Reset Position (in case you get lost)
            controller2.addEventListener('selectstart', resetGamePosition);
            scene.add(controller2);

            // Visual Models
            const modelFactory = new XRControllerModelFactory();
            
            const grip1 = renderer.xr.getControllerGrip(0);
            grip1.add(modelFactory.createControllerModel(grip1));
            scene.add(grip1);

            const grip2 = renderer.xr.getControllerGrip(1);
            grip2.add(modelFactory.createControllerModel(grip2));
            scene.add(grip2);
        }

        function resetGamePosition() {
            // Resets the object to be in front of the camera again
            const vec = new THREE.Vector3();
            const dir = new THREE.Vector3();
            camera.getWorldPosition(vec);
            camera.getWorldDirection(dir);
            
            gameGroup.position.copy(vec).add(dir.multiplyScalar(GAME_DIST));
            gameGroup.lookAt(vec); // Look at player
        }

        // =========================================================
        // MAIN LOOP
        // =========================================================
        function render() {
            // Get Gamepad Input
            handleInput();

            // Update Bullets
            updateBullets();

            // Raycast Player Position
            updatePlayerPosition();

            renderer.render(scene, camera);
        }

        function handleInput() {
            const session = renderer.xr.getSession();
            if (!session) return;

            // Iterate sources
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const gp = source.gamepad;

                // LEFT HAND (Movement / Rotation)
                if (source.handedness === 'left' && gp.axes.length >= 4) {
                    const x = gp.axes[2];
                    const y = gp.axes[3];
                    
                    if (Math.abs(x) > 0.1 || Math.abs(y) > 0.1) {
                        // Rotation Axis Logic: 
                        // Stick Left/Right (x) -> Rotate around Y
                        // Stick Up/Down (y)    -> Rotate around X
                        const rotSpeed = 0.05;
                        const axis = new THREE.Vector3(y, -x, 0).normalize();
                        // Rotate the LEVEL, not the player
                        levelMesh.rotateOnWorldAxis(axis, Math.sqrt(x*x + y*y) * rotSpeed);
                    }
                }

                // RIGHT HAND (Shooting)
                if (source.handedness === 'right' && gp.axes.length >= 4) {
                    const x = gp.axes[2];
                    const y = gp.axes[3];

                    // Simple cooldown check
                    if (!window.cooldown) window.cooldown = 0;
                    if (window.cooldown > 0) window.cooldown--;

                    if ((Math.abs(x) > 0.2 || Math.abs(y) > 0.2) && window.cooldown <= 0) {
                        shootBullet(x, y);
                        window.cooldown = 10; // Frames
                    }
                }
            }
        }

        function updatePlayerPosition() {
            // Cast a ray from Camera (0,0,0) forward into the scene
            // Because in MR the camera moves, we get its world coords
            const camPos = new THREE.Vector3();
            const camDir = new THREE.Vector3();
            camera.getWorldPosition(camPos);
            camera.getWorldDirection(camDir);

            raycaster.set(camPos, camDir);
            
            // Check intersection with Level
            const intersects = raycaster.intersectObject(levelMesh);
            
            if (intersects.length > 0) {
                const hit = intersects[0];
                
                // Position marker at hit point
                playerMarker.position.copy(hit.point);
                playerMarker.visible = true;

                // Align marker to surface normal
                const n = hit.face.normal.clone().transformDirection(levelMesh.matrixWorld);
                const up = new THREE.Vector3(0, 1, 0); // Default cone direction
                const q = new THREE.Quaternion().setFromUnitVectors(up, n);
                playerMarker.quaternion.slerp(q, 0.5);
            } else {
                // If aiming off-shape, hide cursor or keep last pos
                // playerMarker.visible = false; 
            }
        }

        function shootBullet(stickX, stickY) {
            // Direction based on stick input relative to camera view
            // In a real twin stick, 'Up' shoots up on screen.
            const shootDir = new THREE.Vector3(stickX, -stickY, 0); // Z is 0 in view space
            shootDir.applyQuaternion(camera.quaternion); // Transform to World Space
            shootDir.normalize();

            // Create Bullet
            const geo = new THREE.SphereGeometry(0.005);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const mesh = new THREE.Mesh(geo, mat);
            
            // Start at player position
            mesh.position.copy(playerMarker.position);
            
            // Add slight lift so it doesn't clip immediately
            mesh.position.addScaledVector(shootDir, 0.05);

            scene.add(mesh);

            bullets.push({
                mesh: mesh,
                velocity: shootDir.multiplyScalar(0.02), // Speed
                life: 60 // Frames
            });
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.add(b.velocity);
                b.life--;
                
                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

    </script>
</body>
</html>
