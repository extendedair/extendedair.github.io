<!DOCTYPE html>
<html lang="en">
<head>
    <title>MR Sphere Shooter Boss Update</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #overlay {
            position: absolute; bottom: 20px; width: 100%; 
            text-align: center; color: #0ff; font-family: monospace;
            pointer-events: none; text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>
    <div id="overlay">L-Stick: Move | R-Stick: Aim & Shoot | Boss incoming...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // --- Globals ---
        let camera, scene, renderer;
        let worldGroup, levelSphere, playerMesh, playerRotationAnchor;
        
        // Game State
        const SPHERE_RADIUS = 0.325;
        let lives = 3;
        let isInvulnerable = false;
        let invulnerableTimer = 0;
        let shotCooldown = 0;
        
        // Boss State
        let bossTimer = 0;
        let bossActive = false;
        let bossEntity = null;
        
        // Entities
        const enemies = []; 
        const playerBullets = [];
        const enemyBullets = [];
        const bossBullets = [];
        const particles = [];

        // Audio
        const audio = new SoundManager();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local'] }));

            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 5, 2);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            buildGameWorld();

            scene.add(renderer.xr.getController(0));
            scene.add(renderer.xr.getController(1));

            renderer.setAnimationLoop(render);
        }

        // --- Audio System ---
        function SoundManager() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = ctx.createGain();
            gain.gain.value = 0.1; 
            gain.connect(ctx.destination);
            
            let sirenOsc = null;
            let sirenGain = null;

            this.resume = () => { if(ctx.state === 'suspended') ctx.resume(); };

            this.shoot = () => {
                this.resume();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                g.gain.setValueAtTime(0.1, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(g); g.connect(gain);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            };

            this.explode = () => {
                this.resume();
                playNoise(0.3, 1000, 0.2);
            };

            this.bossExplode = () => {
                this.resume();
                // Deeper, louder, longer
                playNoise(1.0, 300, 0.6); 
            };

            this.startSiren = () => {
                if(sirenOsc) return;
                this.resume();
                sirenOsc = ctx.createOscillator();
                sirenGain = ctx.createGain();
                sirenOsc.type = 'sawtooth';
                sirenOsc.frequency.value = 150;
                sirenGain.gain.value = 0.05;
                
                // LFO for wailing sound
                const lfo = ctx.createOscillator();
                lfo.frequency.value = 2; // Hz
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 50;
                lfo.connect(lfoGain);
                lfoGain.connect(sirenOsc.frequency);
                
                sirenOsc.connect(sirenGain);
                sirenGain.connect(gain);
                
                sirenOsc.start();
                lfo.start();
                sirenOsc.lfo = lfo; // store to stop
            };

            this.stopSiren = () => {
                if(sirenOsc) {
                    sirenOsc.stop();
                    sirenOsc.lfo.stop();
                    sirenOsc.disconnect();
                    sirenOsc = null;
                }
            };

            function playNoise(dur, freq, vol) {
                const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
                const d = buf.getChannelData(0);
                for(let i=0; i<d.length; i++) d[i] = Math.random()*2-1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const g = ctx.createGain();
                const f = ctx.createBiquadFilter();
                f.type = 'lowpass'; f.frequency.value = freq;
                g.gain.setValueAtTime(vol, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+dur);
                src.connect(f); f.connect(g); g.connect(gain);
                src.start();
            }
        }

        // --- Geometry Builders ---

        function createHeroShip() {
            const group = new THREE.Group();
            
            // Materials
            const matBlue = new THREE.MeshPhongMaterial({ 
                color: 0x0044ff, 
                flatShading: true,
                polygonOffset: true, polygonOffsetFactor: 1 
            });
            const matWire = new THREE.LineBasicMaterial({ color: 0xffffff });

            function addPart(geo, x, y, z, rotX=0) {
                const mesh = new THREE.Mesh(geo, matBlue);
                mesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), matWire));
                mesh.position.set(x,y,z);
                if(rotX) mesh.rotation.x = rotX;
                group.add(mesh);
            }

            // REPLACEMENT: Sausages (Capsules) instead of Cylinders
            
            // 1. Center Fuselage (Thick, Long)
            addPart(new THREE.CapsuleGeometry(0.012, 0.06, 4, 8), 0, 0, 0, Math.PI/2);

            // 2. Left Engine
            addPart(new THREE.CapsuleGeometry(0.006, 0.04, 4, 8), -0.025, 0, 0, Math.PI/2);

            // 3. Right Engine
            addPart(new THREE.CapsuleGeometry(0.006, 0.04, 4, 8), 0.025, 0, 0, Math.PI/2);

            // 4. Wing
            const wingGeo = new THREE.BoxGeometry(0.06, 0.002, 0.02);
            addPart(wingGeo, 0, 0, 0);

            // SCALE: 30% Smaller (0.7)
            group.scale.set(0.7, 0.7, 0.7);

            return group;
        }

        function createDiamondEnemy() {
            const grp = new THREE.Group();
            const geo = new THREE.OctahedronGeometry(0.03, 0);
            geo.scale(1, 1.5, 1);
            const mesh = new THREE.Mesh(
                geo, 
                new THREE.MeshPhongMaterial({ color: 0xFF8800, flatShading: true })
            );
            mesh.rotation.x = Math.PI/2;
            mesh.add(new THREE.LineSegments(
                new THREE.WireframeGeometry(geo), 
                new THREE.LineBasicMaterial({ color: 0xFFCC00 })
            ));
            grp.add(mesh);
            return grp;
        }

        function createBossMesh() {
            const grp = new THREE.Group();
            // Sphere, 50% larger than enemy (0.03) -> 0.045
            const geo = new THREE.SphereGeometry(0.045, 24, 24);
            const mat = new THREE.MeshPhongMaterial({ color: 0xFF0000, flatShading: true }); // Base color, will cycle
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.add(new THREE.LineSegments(
                new THREE.WireframeGeometry(geo),
                new THREE.LineBasicMaterial({ color: 0xFFFFFF })
            ));
            
            // Add spikes to look mean
            const spikeGeo = new THREE.ConeGeometry(0.005, 0.02, 8);
            for(let i=0; i<6; i++) {
                const spike = new THREE.Mesh(spikeGeo, new THREE.MeshBasicMaterial({color:0x000}));
                if(i<4) {
                    spike.rotation.x = Math.PI/2;
                    spike.rotation.z = (Math.PI/2) * i;
                    spike.translateY(0.045);
                } else {
                    spike.translateY(i===4 ? 0.045 : -0.045);
                }
                mesh.add(spike);
            }
            
            grp.add(mesh);
            return grp;
        }

        function buildGameWorld() {
            worldGroup = new THREE.Group();
            worldGroup.position.set(0, 0, -1);
            scene.add(worldGroup);

            // Level
            levelSphere = new THREE.Group();
            const mainMesh = new THREE.Mesh(
                new THREE.SphereGeometry(SPHERE_RADIUS, 48, 48),
                new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 10, polygonOffset: true, polygonOffsetFactor: 1 })
            );
            mainMesh.add(new THREE.LineSegments(
                new THREE.WireframeGeometry(mainMesh.geometry),
                new THREE.LineBasicMaterial({ color: 0x444444, linewidth: 1 })
            ));
            levelSphere.add(mainMesh);
            
            // Details
            const equator = new THREE.Mesh(new THREE.TorusGeometry(SPHERE_RADIUS, 0.008, 16, 100), new THREE.MeshBasicMaterial({ color: 0x111111 }));
            equator.rotation.x = Math.PI/2;
            levelSphere.add(equator);

            const dishGroup = new THREE.Group();
            dishGroup.add(new THREE.Mesh(new THREE.CircleGeometry(0.08, 32), new THREE.MeshBasicMaterial({ color: 0x444444, side: 2 })));
            dishGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.002, 16, 32), new THREE.MeshBasicMaterial({color:0x000})));
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.005, 0.04, 8), new THREE.MeshBasicMaterial({color:0x222}));
            spike.rotation.x = Math.PI/2;
            dishGroup.add(spike);
            dishGroup.position.set(0, 0.6, 0.5).normalize().multiplyScalar(SPHERE_RADIUS + 0.002);
            dishGroup.lookAt(0,0,0);
            levelSphere.add(dishGroup);

            worldGroup.add(levelSphere);

            // Player Anchor
            playerRotationAnchor = new THREE.Group();
            playerRotationAnchor.position.set(0, 0, SPHERE_RADIUS + 0.02);
            playerMesh = createHeroShip();
            // Rotate anchor to lay flat
            playerRotationAnchor.rotation.x = Math.PI/2;
            playerRotationAnchor.add(playerMesh);
            worldGroup.add(playerRotationAnchor);

            // Enemies
            for(let i=0; i<8; i++) spawnEnemy();
        }

        function spawnEnemy() {
            const mesh = createDiamondEnemy();
            levelSphere.add(mesh);
            const pos = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(SPHERE_RADIUS + 0.02);
            mesh.position.copy(pos);
            const tangent = new THREE.Vector3().crossVectors(pos.clone().normalize(), new THREE.Vector3(Math.random(), Math.random(), Math.random())).normalize();

            enemies.push({
                mesh: mesh,
                velocity: tangent.multiplyScalar(0.2),
                bullets: [], 
                shootTimer: Math.random() * 2
            });
        }

        function spawnBoss() {
            bossActive = true;
            audio.startSiren();
            
            const mesh = createBossMesh();
            levelSphere.add(mesh);
            
            // Spawn opposite player?
            const pos = new THREE.Vector3(0, 0, -1).normalize().multiplyScalar(SPHERE_RADIUS + 0.04);
            mesh.position.copy(pos);

            bossEntity = {
                mesh: mesh,
                hp: 3,
                shootTimer: 0
            };
        }

        function despawnBoss(explode) {
            bossActive = false;
            audio.stopSiren();
            if(bossEntity) {
                levelSphere.remove(bossEntity.mesh);
                if(explode) {
                    createExplosion(bossEntity.mesh.position, 0xFFFFFF, 30);
                    audio.bossExplode();
                }
                bossEntity = null;
            }
        }

        function spawnBullet(isPlayer, origin, target, owner) {
            const list = isPlayer ? playerBullets : (owner === bossEntity ? bossBullets : enemyBullets);
            const limit = isPlayer ? 10 : (owner === bossEntity ? 8 : 1);
            
            if (list.length >= limit) return;

            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(isPlayer ? 0.006 : 0.008, 8, 8),
                new THREE.MeshBasicMaterial({ color: isPlayer ? 0xAAFFFF : 0xFF0000 })
            );

            // Pos
            const pLocal = playerMesh.getWorldPosition(new THREE.Vector3());
            levelSphere.worldToLocal(pLocal);
            
            let pos, dir;
            if (isPlayer) {
                // Origin is player
                pos = pLocal.clone();
                // Dir from stick (target x,y)
                const dirWorld = new THREE.Vector3(origin.x, -origin.y, 0).normalize();
                dir = dirWorld.transformDirection(levelSphere.matrixWorld.clone().invert());
            } else {
                // Origin is enemy/boss
                pos = origin.clone();
                // Dir to player
                dir = new THREE.Vector3().subVectors(pLocal, pos).normalize();
            }

            mesh.position.copy(pos);
            levelSphere.add(mesh);
            list.push({ mesh, velocity: dir.multiplyScalar(isPlayer ? 0.6 : 0.3), life: 2.0 });
            
            if(isPlayer) audio.shoot();
        }

        function createExplosion(pos, color, count=12) {
            if(count === 12) audio.explode();
            const geo = new THREE.BoxGeometry(0.008, 0.008, 0.008);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                const vel = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(0.4);
                levelSphere.add(mesh);
                particles.push({ mesh, velocity: vel, life: 0.8 });
            }
        }

        function handlePlayerHit() {
            if (isInvulnerable) return;
            lives--;
            isInvulnerable = true;
            invulnerableTimer = 3.0;
            audio.explode();
            if (lives <= 0) lives = 3;
        }

        function update(dt, moveX, moveY, shotX, shotY) {
            // --- Player Rotation (Based on Shooting Direction) ---
            // Y is Up (-1), X is Right (1).
            if (Math.abs(shotX) > 0.1 || Math.abs(shotY) > 0.1) {
                const angle = Math.atan2(-shotX, shotY); 
                playerMesh.rotation.y = angle; 
            }

            // --- Boss Logic ---
            if (!bossActive) {
                bossTimer += dt;
                if(bossTimer >= 10) {
                    bossTimer = 0;
                    spawnBoss();
                }
            } else {
                bossTimer += dt;
                
                // Color Cycling
                const hue = (Date.now() % 2000) / 2000;
                bossEntity.mesh.children[0].material.color.setHSL(hue, 1, 0.5);

                // Move slowly (orbit)
                bossEntity.mesh.position.applyAxisAngle(new THREE.Vector3(1,0,0), dt * 0.2);
                bossEntity.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.04);
                bossEntity.mesh.lookAt(0,0,0); // Align

                // Shoot Stream
                bossEntity.shootTimer -= dt;
                if(bossEntity.shootTimer <= 0) {
                    spawnBullet(false, bossEntity.mesh.position, null, bossEntity);
                    bossEntity.shootTimer = 0.2; // Fast fire
                }

                // Despawn if timeout
                if(bossTimer >= 10) {
                    bossTimer = 0;
                    despawnBoss(false);
                }
            }

            // --- Particles ---
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.life -= dt;
                p.mesh.position.addScaledVector(p.velocity, dt);
                p.mesh.scale.multiplyScalar(0.9);
                if(p.life <= 0) { levelSphere.remove(p.mesh); particles.splice(i,1); }
            }

            // --- Invulnerability ---
            if (isInvulnerable) {
                invulnerableTimer -= dt;
                playerMesh.visible = Math.floor(invulnerableTimer * 10) % 2 === 0;
                if (invulnerableTimer <= 0) {
                    isInvulnerable = false;
                    playerMesh.visible = true;
                }
            } else {
                playerMesh.visible = true;
            }

            const pLocal = playerMesh.getWorldPosition(new THREE.Vector3());
            levelSphere.worldToLocal(pLocal);

            // --- Enemies ---
            enemies.forEach(e => {
                e.mesh.position.addScaledVector(e.velocity, dt);
                e.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.02);
                
                const norm = e.mesh.position.clone().normalize();
                e.velocity.sub(norm.multiplyScalar(e.velocity.dot(norm))).normalize().multiplyScalar(0.2);
                e.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), norm);
                if(Math.random()<0.05) e.velocity.add(new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).multiplyScalar(0.1));

                e.shootTimer -= dt;
                if(e.shootTimer <= 0) {
                    spawnBullet(false, e.mesh.position, null, e);
                    e.shootTimer = 1.0 + Math.random() * 2.0;
                }
                
                for(let k=e.bullets.length-1; k>=0; k--) if(e.bullets[k].life<=0) e.bullets.splice(k,1);

                if (e.mesh.position.distanceToSquared(pLocal) < 0.0025) handlePlayerHit();
            });

            // --- Player Bullets ---
            for(let i=playerBullets.length-1; i>=0; i--) {
                const b = playerBullets[i];
                b.life -= dt;
                b.mesh.position.addScaledVector(b.velocity, dt);
                b.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.015);
                
                let hit = false;
                
                // Vs Enemies
                for(let j=enemies.length-1; j>=0; j--) {
                    if (b.mesh.position.distanceToSquared(enemies[j].mesh.position) < 0.003) {
                        createExplosion(enemies[j].mesh.position, 0xFF8800);
                        levelSphere.remove(enemies[j].mesh);
                        enemies[j].bullets.forEach(eb => eb.life = 0);
                        enemies.splice(j,1);
                        levelSphere.remove(b.mesh);
                        playerBullets.splice(i,1);
                        hit = true;
                        spawnEnemy();
                        break;
                    }
                }

                // Vs Boss
                if(!hit && bossActive) {
                    if(b.mesh.position.distanceToSquared(bossEntity.mesh.position) < 0.008) {
                        audio.explode(); // Hit sound
                        bossEntity.hp--;
                        if(bossEntity.hp <= 0) {
                            despawnBoss(true); // Boom
                            bossTimer = 0; // Reset timer for next loop
                        }
                        levelSphere.remove(b.mesh);
                        playerBullets.splice(i,1);
                        hit = true;
                    }
                }

                if (!hit && b.life <= 0) {
                    levelSphere.remove(b.mesh);
                    playerBullets.splice(i,1);
                }
            }

            // --- Enemy/Boss Bullets ---
            const allHostileBullets = [...enemyBullets, ...bossBullets];
            // We manage lifecycles in the original arrays, this is just for update loop simplicity
            
            [enemyBullets, bossBullets].forEach(list => {
                for(let i=list.length-1; i>=0; i--) {
                    const b = list[i];
                    b.life -= dt;
                    b.mesh.position.addScaledVector(b.velocity, dt);
                    b.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.015);
                    
                    const n = b.mesh.position.clone().normalize();
                    b.velocity.sub(n.multiplyScalar(b.velocity.dot(n))).normalize().multiplyScalar(0.3);

                    if (b.mesh.position.distanceToSquared(pLocal) < 0.002) {
                        handlePlayerHit();
                        b.life = 0;
                    }
                    if (b.life <= 0) {
                        levelSphere.remove(b.mesh);
                        list.splice(i,1);
                    }
                }
            });
        }

        function render() {
            const dt = 0.016;
            const session = renderer.xr.getSession();
            let moveX=0, moveY=0, shotX=0, shotY=0;

            if (session) {
                for (const source of session.inputSources) {
                    const gp = source.gamepad;
                    if (!gp || gp.axes.length<4) continue;
                    if (source.handedness==='left') { moveX=gp.axes[2]; moveY=gp.axes[3]; }
                    if (source.handedness==='right') { shotX=gp.axes[2]; shotY=gp.axes[3]; }
                }
            }

            const rotSpeed = 1.4 * dt; 
            if (Math.abs(moveX)>0.1 || Math.abs(moveY)>0.1) {
                if(Math.abs(moveY)>0.1) levelSphere.rotateOnWorldAxis(new THREE.Vector3(1,0,0), moveY*rotSpeed);
                if(Math.abs(moveX)>0.1) levelSphere.rotateOnWorldAxis(new THREE.Vector3(0,1,0), moveX*rotSpeed);
            }

            if (shotCooldown > 0) shotCooldown -= dt;
            if ((shotX*shotX + shotY*shotY) > 0.25 && shotCooldown <= 0) {
                spawnPlayerBullet(shotX, shotY);
                shotCooldown = 0.15;
            }

            update(dt, moveX, moveY, shotX, shotY);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
