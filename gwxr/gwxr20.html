<!DOCTYPE html>
<html lang="en">
<head>
    <title>MR Sphere Shooter Final</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #overlay {
            position: absolute; bottom: 20px; width: 100%; 
            text-align: center; color: #0ff; font-family: monospace;
            pointer-events: none; text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>
    <div id="overlay">L-Stick: Move & Turn | R-Stick: Shoot | 8 Enemies</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // --- Globals ---
        let camera, scene, renderer;
        let worldGroup, levelSphere, playerMesh;
        let playerRotationAnchor; // Helper to rotate ship locally
        
        // Game State
        const SPHERE_RADIUS = 0.325;
        let lives = 3;
        let isInvulnerable = false;
        let invulnerableTimer = 0;
        let shotCooldown = 0;
        
        // Entities
        const enemies = []; 
        const playerBullets = [];
        const enemyBullets = [];
        const particles = [];

        // Audio
        const audio = new SoundManager();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local'] }));

            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 5, 2);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            buildGameWorld();

            scene.add(renderer.xr.getController(0));
            scene.add(renderer.xr.getController(1));

            renderer.setAnimationLoop(render);
        }

        // --- Audio System ---
        function SoundManager() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = ctx.createGain();
            gain.gain.value = 0.1; 
            gain.connect(ctx.destination);
            
            this.resume = () => { if(ctx.state === 'suspended') ctx.resume(); };

            this.shoot = () => {
                this.resume();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                g.gain.setValueAtTime(0.1, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(g); g.connect(gain);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            };

            this.explode = () => {
                this.resume();
                const buf = ctx.createBuffer(1, ctx.sampleRate*0.3, ctx.sampleRate);
                const d = buf.getChannelData(0);
                for(let i=0; i<d.length; i++) d[i] = Math.random()*2-1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const g = ctx.createGain();
                const f = ctx.createBiquadFilter();
                f.type = 'lowpass'; f.frequency.value = 1000;
                g.gain.setValueAtTime(0.2, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3);
                src.connect(f); f.connect(g); g.connect(gain);
                src.start();
            };
        }

        // --- Geometry Builders ---

        function createHeroShip() {
            const group = new THREE.Group();
            
            // Materials
            const matBlue = new THREE.MeshPhongMaterial({ 
                color: 0x0044ff, 
                flatShading: true,
                polygonOffset: true, polygonOffsetFactor: 1 
            });
            const matWire = new THREE.LineBasicMaterial({ color: 0xffffff });

            // Helper to build parts
            function addPart(geo, x, y, z, rotX=0) {
                const mesh = new THREE.Mesh(geo, matBlue);
                mesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), matWire));
                mesh.position.set(x,y,z);
                if(rotX) mesh.rotation.x = rotX;
                group.add(mesh);
            }

            // 1. Center Fuselage (Thick, Long)
            // Cylinder aligned along Z? Standard is Y. We rotate X to point Z.
            addPart(new THREE.CylinderGeometry(0.012, 0.012, 0.08, 8), 0, 0, 0, Math.PI/2);

            // 2. Left Engine (Thinner)
            addPart(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 8), -0.025, 0, 0, Math.PI/2);

            // 3. Right Engine (Thinner)
            addPart(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 8), 0.025, 0, 0, Math.PI/2);

            // 4. Wing
            const wingGeo = new THREE.BoxGeometry(0.06, 0.002, 0.02);
            addPart(wingGeo, 0, 0, 0);

            // Group orientation:
            // The cylinders point along Z axis. 
            // In our game, the player sits on top of the sphere (Z up), 
            // so we'll need to rotate this group so Z points "Forward" relative to the view.
            return group;
        }

        function createDiamondEnemy() {
            const grp = new THREE.Group();
            const geo = new THREE.OctahedronGeometry(0.03, 0);
            geo.scale(1, 1.5, 1);
            const mesh = new THREE.Mesh(
                geo, 
                new THREE.MeshPhongMaterial({ color: 0xFF8800, flatShading: true })
            );
            mesh.rotation.x = Math.PI/2;
            mesh.add(new THREE.LineSegments(
                new THREE.WireframeGeometry(geo), 
                new THREE.LineBasicMaterial({ color: 0xFFCC00 })
            ));
            grp.add(mesh);
            return grp;
        }

        function buildGameWorld() {
            worldGroup = new THREE.Group();
            worldGroup.position.set(0, 0, -1);
            scene.add(worldGroup);

            // 1. Level Sphere
            levelSphere = new THREE.Group();
            const mainMesh = new THREE.Mesh(
                new THREE.SphereGeometry(SPHERE_RADIUS, 48, 48),
                new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 10, polygonOffset: true, polygonOffsetFactor: 1 })
            );
            mainMesh.add(new THREE.LineSegments(
                new THREE.WireframeGeometry(mainMesh.geometry),
                new THREE.LineBasicMaterial({ color: 0x444444, linewidth: 1 })
            ));
            levelSphere.add(mainMesh);
            
            // Fixed Equator (Dark raised ring)
            const eqGeo = new THREE.TorusGeometry(SPHERE_RADIUS, 0.008, 16, 100);
            const equator = new THREE.Mesh(eqGeo, new THREE.MeshBasicMaterial({ color: 0x111111 }));
            equator.rotation.x = Math.PI/2;
            levelSphere.add(equator);

            // Improved Dish Weapon
            const dishGroup = new THREE.Group();
            const dishBase = new THREE.Mesh(
                new THREE.CircleGeometry(0.08, 32),
                new THREE.MeshBasicMaterial({ color: 0x444444, side: 2 })
            );
            dishGroup.add(dishBase);
            // Rings
            const r1 = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.002, 16, 32), new THREE.MeshBasicMaterial({color:0x000}));
            const r2 = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.002, 16, 32), new THREE.MeshBasicMaterial({color:0x000}));
            dishGroup.add(r1); dishGroup.add(r2);
            // Spike
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.005, 0.04, 8), new THREE.MeshBasicMaterial({color:0x222}));
            spike.rotation.x = Math.PI/2;
            dishGroup.add(spike);

            dishGroup.position.set(0, 0.6, 0.5).normalize().multiplyScalar(SPHERE_RADIUS + 0.002);
            dishGroup.lookAt(0,0,0);
            levelSphere.add(dishGroup);

            worldGroup.add(levelSphere);

            // 2. Player
            // We use an anchor to handle the "Turning" rotation separate from the "Position"
            playerRotationAnchor = new THREE.Group();
            playerRotationAnchor.position.set(0, 0, SPHERE_RADIUS + 0.02);
            
            playerMesh = createHeroShip();
            // By default our ship points Z. We want it flat on surface.
            // Rotating X 90 makes Z point "Up" relative to anchor.
            // Wait, ship cylinders point Z.
            // If we want ship to look like it's flying "Forward" (Up on screen), that is Y axis in 2D input.
            // Let's position it so it lays flat.
            // Rotating X -90 makes Z point Up.
            // Let's just add it to anchor and adjust.
            
            playerRotationAnchor.add(playerMesh);
            worldGroup.add(playerRotationAnchor);
            
            // Align ship to sit flat. 
            // Our geometry builder makes cylinders along Z.
            // We want Z to be tangent to surface.
            // So we don't need to rotate the mesh inside the anchor if the anchor is Z-Up.
            // But worldGroup is Z-forward.
            // Let's set anchor rotation.
            playerRotationAnchor.rotation.x = Math.PI/2; // Now Anchor Z points -Y world, Anchor Y points Z world.
            // Actually, simplest is:
            // Player Anchor is at (0,0,Radius).
            // Player Mesh is child.
            // We want Player Mesh to lay flat. The cylinders are along Z.
            // So if we leave it, the ship points out of the sphere (Z).
            // Rotate Mesh X 90? -> Points Y.
            // Let's refine in update loop.

            // 3. Enemies
            for(let i=0; i<8; i++) spawnEnemy();
        }

        function spawnEnemy() {
            const mesh = createDiamondEnemy();
            levelSphere.add(mesh);
            
            const pos = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(SPHERE_RADIUS + 0.02);
            mesh.position.copy(pos);

            const normal = pos.clone().normalize();
            const tangent = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(Math.random(), Math.random(), Math.random())).normalize();

            enemies.push({
                mesh: mesh,
                velocity: tangent.multiplyScalar(0.2),
                bullets: [], 
                shootTimer: Math.random() * 2
            });
        }

        function spawnPlayerBullet(sx, sy) {
            if (playerBullets.length >= 10) return;
            
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.006, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xAAFFFF })
            );
            
            const worldPos = playerMesh.getWorldPosition(new THREE.Vector3());
            levelSphere.worldToLocal(worldPos);
            mesh.position.copy(worldPos);
            
            const dirWorld = new THREE.Vector3(sx, -sy, 0).normalize();
            const velLocal = dirWorld.transformDirection(levelSphere.matrixWorld.clone().invert());
            
            levelSphere.add(mesh);
            playerBullets.push({ mesh, velocity: velLocal.multiplyScalar(0.6), life: 2.0 });
            audio.shoot();
        }

        function spawnEnemyBullet(enemy) {
            // REDUCED LIMIT: Only 1 bullet per enemy
            if (enemy.bullets.length >= 1) return;

            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.008, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xFF0000 })
            );
            mesh.position.copy(enemy.mesh.position);

            const pLocal = playerMesh.getWorldPosition(new THREE.Vector3());
            levelSphere.worldToLocal(pLocal);
            const dir = new THREE.Vector3().subVectors(pLocal, enemy.mesh.position).normalize();

            levelSphere.add(mesh);
            const b = { mesh, velocity: dir.multiplyScalar(0.3), life: 3.0 };
            enemyBullets.push(b);
            enemy.bullets.push(b);
        }

        function createExplosion(pos, color) {
            audio.explode();
            const geo = new THREE.BoxGeometry(0.008, 0.008, 0.008);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            for(let i=0; i<12; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                const vel = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(0.4);
                levelSphere.add(mesh);
                particles.push({ mesh, velocity: vel, life: 0.8 });
            }
        }

        function handlePlayerHit() {
            if (isInvulnerable) return;
            lives--;
            isInvulnerable = true;
            invulnerableTimer = 3.0;
            audio.explode();
            if (lives <= 0) lives = 3;
        }

        function update(dt, moveX, moveY) {
            // --- Player Ship Rotation ---
            // Orient the ship to point in direction of travel (Left Stick)
            if (Math.abs(moveX) > 0.1 || Math.abs(moveY) > 0.1) {
                // Calculate angle from input
                // Y is Up (-1), X is Right (1).
                // We want Up to be rotation 0.
                const angle = Math.atan2(-moveX, moveY); 
                playerMesh.rotation.y = angle; 
            }
            
            // --- Particles ---
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.life -= dt;
                p.mesh.position.addScaledVector(p.velocity, dt);
                p.mesh.scale.multiplyScalar(0.9);
                if(p.life <= 0) { levelSphere.remove(p.mesh); particles.splice(i,1); }
            }

            // --- Invulnerability ---
            if (isInvulnerable) {
                invulnerableTimer -= dt;
                playerMesh.visible = Math.floor(invulnerableTimer * 10) % 2 === 0;
                if (invulnerableTimer <= 0) {
                    isInvulnerable = false;
                    playerMesh.visible = true;
                }
            } else {
                playerMesh.visible = true;
            }

            const pLocal = playerMesh.getWorldPosition(new THREE.Vector3());
            levelSphere.worldToLocal(pLocal);

            // --- Enemies ---
            enemies.forEach(e => {
                e.mesh.position.addScaledVector(e.velocity, dt);
                e.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.02);
                
                const norm = e.mesh.position.clone().normalize();
                e.velocity.sub(norm.multiplyScalar(e.velocity.dot(norm))).normalize().multiplyScalar(0.2);
                
                // Orient Diamond: Pointy ends are Y. Align Y to Normal.
                e.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), norm);

                if(Math.random()<0.05) e.velocity.add(new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).multiplyScalar(0.1));

                e.shootTimer -= dt;
                if(e.shootTimer <= 0) {
                    spawnEnemyBullet(e);
                    e.shootTimer = 1.0 + Math.random() * 2.0;
                }
                
                for(let k=e.bullets.length-1; k>=0; k--) if(e.bullets[k].life<=0) e.bullets.splice(k,1);

                if (e.mesh.position.distanceToSquared(pLocal) < 0.0025) handlePlayerHit();
            });

            // --- Player Bullets ---
            for(let i=playerBullets.length-1; i>=0; i--) {
                const b = playerBullets[i];
                b.life -= dt;
                b.mesh.position.addScaledVector(b.velocity, dt);
                b.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.015);
                
                let hit = false;
                for(let j=enemies.length-1; j>=0; j--) {
                    if (b.mesh.position.distanceToSquared(enemies[j].mesh.position) < 0.003) {
                        createExplosion(enemies[j].mesh.position, 0xFF8800);
                        levelSphere.remove(enemies[j].mesh);
                        enemies[j].bullets.forEach(eb => eb.life = 0);
                        enemies.splice(j,1);
                        levelSphere.remove(b.mesh);
                        playerBullets.splice(i,1);
                        hit = true;
                        spawnEnemy();
                        break;
                    }
                }
                if (!hit && b.life <= 0) {
                    levelSphere.remove(b.mesh);
                    playerBullets.splice(i,1);
                }
            }

            // --- Enemy Bullets ---
            for(let i=enemyBullets.length-1; i>=0; i--) {
                const b = enemyBullets[i];
                b.life -= dt;
                b.mesh.position.addScaledVector(b.velocity, dt);
                b.mesh.position.normalize().multiplyScalar(SPHERE_RADIUS + 0.015);
                
                const n = b.mesh.position.clone().normalize();
                b.velocity.sub(n.multiplyScalar(b.velocity.dot(n))).normalize().multiplyScalar(0.3);

                if (b.mesh.position.distanceToSquared(pLocal) < 0.002) {
                    handlePlayerHit();
                    b.life = 0;
                }
                if (b.life <= 0) {
                    levelSphere.remove(b.mesh);
                    enemyBullets.splice(i,1);
                }
            }
        }

        function render() {
            const dt = 0.016;
            const session = renderer.xr.getSession();
            let moveX=0, moveY=0, shotX=0, shotY=0;

            if (session) {
                for (const source of session.inputSources) {
                    const gp = source.gamepad;
                    if (!gp || gp.axes.length<4) continue;
                    if (source.handedness==='left') { moveX=gp.axes[2]; moveY=gp.axes[3]; }
                    if (source.handedness==='right') { shotX=gp.axes[2]; shotY=gp.axes[3]; }
                }
            }

            // Rotation (Speed 1.4)
            const rotSpeed = 1.4 * dt; 
            if (Math.abs(moveX)>0.1 || Math.abs(moveY)>0.1) {
                if(Math.abs(moveY)>0.1) levelSphere.rotateOnWorldAxis(new THREE.Vector3(1,0,0), moveY*rotSpeed);
                if(Math.abs(moveX)>0.1) levelSphere.rotateOnWorldAxis(new THREE.Vector3(0,1,0), moveX*rotSpeed);
            }

            if (shotCooldown > 0) shotCooldown -= dt;
            if ((shotX*shotX + shotY*shotY) > 0.25 && shotCooldown <= 0) {
                spawnPlayerBullet(shotX, shotY);
                shotCooldown = 0.15;
            }

            update(dt, moveX, moveY);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
