<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quest 3 MR: Lumpy Tunnels</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
    </style>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // ============================================================================
        // CONFIGURATION
        // ============================================================================
        const CONFIG = {
            scrollSpeed: 1.4,
            
            // View Settings
            spawnX: 4.5,            
            despawnX: -4.5,         
            viewZ: -2.5,            
            
            // Geometry - Decreased length for smoother "Lumps"
            segmentLength: 0.15,     
            radSegments: 16,        
            
            // Dimensions
            radiusMin: 0.15, // Very thin pinch points
            radiusMax: 0.50, // Fat lumps
            
            // Positions
            topY: 0.5,
            bottomY: -0.5
        };

        // ============================================================================
        // MATERIALS
        // ============================================================================

        const celMat = new THREE.ShaderMaterial({
            uniforms: {
                colorDeep: { value: new THREE.Color(0x0055ff) }, // Bright Blue
                colorRim:  { value: new THREE.Color(0x444444) }  // Grey
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 colorDeep;
                uniform vec3 colorRim;
                varying vec2 vUv;

                void main() {
                    // 0.5 is the Spine (Deepest part).
                    float dist = abs(vUv.y - 0.5) * 2.0; 
                    
                    // Cel Bands
                    float bands = 4.0;
                    float stepped = floor(dist * bands) / bands;

                    vec3 col = mix(colorDeep, colorRim, stepped);
                    gl_FragColor = vec4(col, 0.95);
                }
            `,
            side: THREE.DoubleSide, 
            transparent: true,
            depthWrite: true
        });

        const wireMat = new THREE.LineBasicMaterial({
            color: 0xffffff,
            linewidth: 1,
            transparent: true,
            opacity: 0.4
        });

        // ============================================================================
        // GEOMETRY GENERATION
        // ============================================================================

        function getRing(cx, cy, cz, r, startAng, endAng) {
            const pos = [];
            const uv = [];
            
            for(let i=0; i <= CONFIG.radSegments; i++) {
                const ratio = i / CONFIG.radSegments;
                // Interpolate angle based on merge state
                const theta = startAng + ratio * (endAng - startAng);

                // Geometry: Bow away from camera (negative sin)
                const vy = cy + (r * Math.cos(theta));
                const vz = cz + (r * -Math.sin(theta));
                
                pos.push(cx, vy, vz);

                // UV Mapping: Map physical angle to UV space to keep shading consistent
                const v = theta / Math.PI; 
                uv.push(0, v);
            }
            return { pos, uv };
        }

        // ============================================================================
        // SCENE CLASSES
        // ============================================================================

        class TunnelSegment {
            constructor(start, end) {
                this.root = new THREE.Group();

                const posAttr = [];
                const uvAttr = [];
                const indices = [];
                const segs = CONFIG.radSegments;
                const row = segs + 1;

                // Build Arrays
                for(let i=0; i<start.pos.length; i+=3) {
                    posAttr.push(start.pos[i], start.pos[i+1], start.pos[i+2]);
                    uvAttr.push(0, start.uv[(i/3)*2+1]);
                }
                for(let i=0; i<end.pos.length; i+=3) {
                    posAttr.push(end.pos[i], end.pos[i+1], end.pos[i+2]);
                    uvAttr.push(1, end.uv[(i/3)*2+1]);
                }

                // Indices
                for(let i=0; i<segs; i++) {
                    const a = i;
                    const b = i + 1;
                    const c = i + row;
                    const d = i + row + 1;
                    indices.push(a, b, d);
                    indices.push(a, d, c);
                }

                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.Float32BufferAttribute(posAttr, 3));
                geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvAttr, 2));
                geom.setIndex(indices);
                geom.computeVertexNormals();

                this.mesh = new THREE.Mesh(geom, celMat);
                
                const wireGeo = new THREE.WireframeGeometry(geom);
                this.wire = new THREE.LineSegments(wireGeo, wireMat);

                this.root.add(this.mesh);
                this.root.add(this.wire);
            }

            translateX(d) {
                this.root.position.x += d;
            }

            dispose() {
                this.mesh.geometry.dispose();
                this.wire.geometry.dispose();
                this.root.removeFromParent();
            }
        }

        class Director {
            constructor() {
                this.time = 0;
                this.mergeState = 0;
                this.mergeFactor = 0;
                this.nextEvent = 5.0;
            }

            update(dt) {
                this.time += dt;

                // Toggle Event
                if(this.time > this.nextEvent) {
                    this.mergeState = 1 - this.mergeState;
                    this.nextEvent = this.time + 4.0 + (Math.random()*4.0);
                }

                // Smooth Transition
                const rate = dt * 0.8;
                if(this.mergeFactor < this.mergeState) 
                    this.mergeFactor = Math.min(this.mergeFactor + rate, 1.0);
                else 
                    this.mergeFactor = Math.max(this.mergeFactor - rate, 0.0);
            }

            getParams(isTop, x) {
                const t = this.mergeFactor;

                // --- LUMP GENERATION ---
                // We use a high frequency sine wave to create the "Lumpy" look.
                // Math.sin(x * 5.0) -> High frequency
                const lumpFactor = Math.sin(x * 5.0 + this.time * 2.0);
                
                // Map the sine wave (-1 to 1) to our radius range
                // This makes the tubes expand and contract rapidly
                const rSplit = THREE.MathUtils.mapLinear(lumpFactor, -1, 1, CONFIG.radiusMin, CONFIG.radiusMax);
                
                // Simple symmetrical wave for Y position (Up/Down)
                const waveY = Math.sin(x * 1.5 + this.time) * 0.1;
                const yBase = isTop ? CONFIG.topY : CONFIG.bottomY;
                const ySplit = yBase + waveY;

                // --- MERGED STATE ---
                // Large steady radius for the ship
                const rMerged = CONFIG.radiusMax * 1.2; 
                const yMerged = 0;

                // --- INTERPOLATION ---
                let y, r, start, end;

                if (isTop) {
                    y = THREE.MathUtils.lerp(ySplit, yMerged, t);
                    r = THREE.MathUtils.lerp(rSplit, rMerged, t);
                    
                    // Angle: Full C -> Top Half
                    start = 0;
                    end = THREE.MathUtils.lerp(Math.PI, Math.PI/2, t);
                } else {
                    y = THREE.MathUtils.lerp(ySplit, yMerged, t);
                    r = THREE.MathUtils.lerp(rSplit, rMerged, t);
                    
                    // Angle: Full C -> Bottom Half
                    start = THREE.MathUtils.lerp(0, Math.PI/2, t);
                    end = Math.PI;
                }

                return { y, r, start, end };
            }
        }

        class Stream {
            constructor(scene, director, isTop) {
                this.scene = scene;
                this.director = director;
                this.isTop = isTop;
                this.segs = [];
                this.cursor = CONFIG.despawnX;

                // Init Tail
                const p = director.getParams(isTop, this.cursor);
                this.tailDat = getRing(this.cursor, p.y, CONFIG.viewZ, p.r, p.start, p.end);

                while(this.cursor < CONFIG.spawnX) this.spawn();
            }

            spawn() {
                const nextX = this.cursor + CONFIG.segmentLength;
                const p = this.director.getParams(this.isTop, nextX);
                const nextDat = getRing(nextX, p.y, CONFIG.viewZ, p.r, p.start, p.end);

                const s = new TunnelSegment(this.tailDat, nextDat);
                this.scene.add(s.root);
                this.segs.push(s);

                this.cursor = nextX;
                this.tailDat = nextDat;
            }

            update(dt) {
                const dx = CONFIG.scrollSpeed * dt;
                
                for(let s of this.segs) s.translateX(-dx);
                this.cursor -= dx;
                
                for(let i=0; i<this.tailDat.pos.length; i+=3) this.tailDat.pos[i] -= dx;

                while(this.cursor < CONFIG.spawnX) this.spawn();
                
                // Cleanup based on position/count
                const max = Math.ceil((CONFIG.spawnX - CONFIG.despawnX)/CONFIG.segmentLength) + 5;
                if(this.segs.length > max) this.segs.shift().dispose();
            }
        }

        // ============================================================================
        // APP SETUP
        // ============================================================================
        let camera, scene, renderer;
        let director, s1, s2;
        let clock;

        init();

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            
            // Fixes for Quest Browser
            renderer.xr.setFoveation(0); 
            renderer.setClearColor(0x000000, 0);

            document.body.appendChild(renderer.domElement);

            const amb = new THREE.AmbientLight(0xffffff, 1);
            scene.add(amb);

            clock = new THREE.Clock();
            director = new Director();

            s1 = new Stream(scene, director, true);
            s2 = new Stream(scene, director, false);

            document.body.appendChild(ARButton.createButton(renderer, { 
                requiredFeatures: ['local'] 
            }));
            
            renderer.setAnimationLoop(render);
        }

        function render() {
            const dt = clock.getDelta();
            
            director.update(dt);
            s1.update(dt);
            s2.update(dt);
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
