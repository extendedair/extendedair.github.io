<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest 3 MR: Wireframe Head</title>
    <!-- A-Frame 1.5.0 (WebXR Standard) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>
        // --- GLOBAL STATE ---
        // Tracks controller inputs for complex interactions (dual-hand gestures)
        const MRState = {
            leftHand: { position: new THREE.Vector3(), grip: false, trigger: false, axis: [0,0,0,0] },
            rightHand: { position: new THREE.Vector3(), grip: false, trigger: false, axis: [0,0,0,0] },
            initialHandDistance: 0,
            initialScale: 1,
            isTwoHandScaling: false
        };

        // 1. VISUALS: WIREFRAME SHADER
        AFRAME.registerComponent('wireframe-style', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    obj.traverse((node) => {
                        if (node.isMesh) {
                            node.material = new THREE.MeshStandardMaterial({
                                color: 0x00ffff, // Cyan
                                wireframe: true,
                                emissive: 0x0044aa,
                                emissiveIntensity: 0.8,
                                roughness: 0.2,
                                metalness: 0.9
                            });
                        }
                    });
                });
            }
        });

        // 2. INPUT: CONTROLLER TRACKER
        AFRAME.registerComponent('controller-tracker', {
            schema: { hand: { type: 'string' } },
            init: function () {
                this.handState = MRState[this.data.hand + 'Hand'];
                
                this.el.addEventListener('triggerdown', () => { this.handState.trigger = true; });
                this.el.addEventListener('triggerup', () => { this.handState.trigger = false; });
                this.el.addEventListener('gripdown', () => { this.handState.grip = true; });
                this.el.addEventListener('gripup', () => { this.handState.grip = false; });
                
                this.el.addEventListener('axismove', (e) => {
                    this.handState.axis = e.detail.axis;
                });
            },
            tick: function () {
                this.el.object3D.getWorldPosition(this.handState.position);
            }
        });

        // 3. LOGIC: MOVEMENT, SCALING & ROTATION
        AFRAME.registerComponent('mr-logic', {
            init: function () {
                this.heldBy = null; 
                this.originalParent = this.el.sceneEl.object3D;
            },

            tick: function (time, timeDelta) {
                const el = this.el;
                const obj = el.object3D;
                const left = MRState.leftHand;
                const right = MRState.rightHand;

                // --- A. DUAL GRIP SCALING (Accordion) ---
                if (left.grip && right.grip) {
                    const currentDist = left.position.distanceTo(right.position);

                    if (!MRState.isTwoHandScaling) {
                        // Start scaling
                        MRState.isTwoHandScaling = true;
                        MRState.initialHandDistance = currentDist;
                        MRState.initialScale = obj.scale.x; 
                    } else {
                        // Update scaling
                        if (MRState.initialHandDistance > 0.01) {
                            const ratio = currentDist / MRState.initialHandDistance;
                            const newScale = Math.max(0.05, MRState.initialScale * ratio);
                            obj.scale.set(newScale, newScale, newScale);
                        }
                    }
                } else {
                    MRState.isTwoHandScaling = false;
                }

                // --- B. RIGHT STICK SCALING ---
                if (!MRState.isTwoHandScaling) {
                    // Axis 3 = Up/Down
                    const rightStickY = right.axis[3]; 
                    if (Math.abs(rightStickY) > 0.2) {
                        const scaleSpeed = 1 - (rightStickY * 0.03);
                        obj.scale.multiplyScalar(scaleSpeed);
                        obj.scale.clampScalar(0.05, 5.0);
                    }
                }

                // --- C. LEFT STICK ROTATION ---
                // Axis 2 = Left/Right (X Rotation), Axis 3 = Up/Down (Y Rotation)
                const leftStickX = left.axis[2]; 
                const leftStickY = left.axis[3]; 

                // Apply rotation relative to world to make it intuitive regardless of current orientation
                if (Math.abs(leftStickY) > 0.1) {
                    // Rotate around World Y (Up)
                    obj.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), -leftStickY * 0.05);
                }
                if (Math.abs(leftStickX) > 0.1) {
                    // Rotate around World X (Right)
                    obj.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), leftStickX * 0.05); 
                }

                // --- D. TRIGGER GRAB (Move + Natural Rotation) ---
                let desiredHand = null;
                let handEntity = null;

                const lRay = document.getElementById('left-hand').components.raycaster;
                const rRay = document.getElementById('right-hand').components.raycaster;
                
                // Check intersections
                const lHit = lRay.getIntersection(el);
                const rHit = rRay.getIntersection(el);

                if (right.trigger && rHit) {
                    desiredHand = 'right';
                    handEntity = document.getElementById('right-hand');
                } else if (left.trigger && lHit) {
                    desiredHand = 'left';
                    handEntity = document.getElementById('left-hand');
                }

                if (desiredHand && this.heldBy !== desiredHand) {
                    // GRAB: Attach object to controller.
                    // Three.js .attach() preserves world transform but changes parent.
                    // This means the object naturally rotates with your wrist (X, Y, and Z).
                    this.heldBy = desiredHand;
                    handEntity.object3D.attach(obj); 
                } else if (!desiredHand && this.heldBy) {
                    // RELEASE: Attach back to scene
                    this.originalParent.attach(obj);
                    this.heldBy = null;
                }
            }
        });

        // 4. PASSTHROUGH: Hides environment in AR
        AFRAME.registerComponent('passthrough-manager', {
            init: function() {
                const scene = this.el.sceneEl;
                const env = document.getElementById('desktop-env');
                scene.addEventListener('enter-vr', () => {
                    if (scene.is('ar-mode') && env) env.setAttribute('visible', false);
                });
                scene.addEventListener('exit-vr', () => {
                    if (env) env.setAttribute('visible', true);
                });
            }
        });
    </script>
</head>
<body>
    <!-- SCENE: Prioritise AR (Passthrough) -->
    <a-scene 
        xr-mode-ui="XRMode: ar"
        webxr="optionalFeatures: hit-test, local-floor;"
        renderer="alpha: true; physicalLights: true; antialias: true;"
        passthrough-manager>

        <!-- ASSETS -->
        <a-assets>
            <a-asset-item id="head-model" src="https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb"></a-asset-item>
        </a-assets>

        <!-- ENVIRONMENT (Desktop Only) -->
        <a-entity id="desktop-env">
            <a-sky color="#222"></a-sky>
            <a-grid material="opacity:0.2; transparent:true" geometry="primitive: plane; width: 50; height: 50;" rotation="-90 0 0"></a-grid>
            <a-light type="ambient" intensity="0.5"></a-light>
        </a-entity>

        <!-- MR LIGHTING -->
        <a-light type="directional" position="1 2 0.5" intensity="1.5" color="#ffffff"></a-light>
        <a-light type="point" position="-1 1 1" intensity="0.5" color="#00ffff"></a-light>

        <!-- INTERACTABLE HEAD -->
        <a-entity 
            id="target-head"
            class="interactable"
            gltf-model="#head-model" 
            wireframe-style
            mr-logic
            position="0 1.5 -1.5" 
            scale="0.5 0.5 0.5"
            rotation="0 -45 0">
        </a-entity>

        <!-- CAMERA & HUD -->
        <!-- We attach the text to the camera so it follows the user's head -->
        <a-entity id="rig" position="0 0 0">
            <a-camera position="0 1.6 0" look-controls="reverseMouseDrag:true">
                <!-- HUD TEXT: Placed low (-0.25) and forward (-0.5) -->
                <a-entity position="0 -0.25 -0.5" scale="0.15 0.15 0.15">
                    <a-text 
                        value="Move: Trigger (Hold) | Resize: Grip (Both) / R-Stick | Rotate: L-Stick" 
                        align="center" 
                        color="white" 
                        opacity="0.8"
                        shader="msdf"
                        font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/roboto/Roboto-Bold.json">
                    </a-text>
                </a-entity>
            </a-camera>

            <!-- HANDS -->
            <a-entity 
                id="right-hand"
                laser-controls="hand: right"
                raycaster="objects: .interactable; far: 10; near: 0.05"
                controller-tracker="hand: right">
            </a-entity>
            <a-entity 
                id="left-hand"
                laser-controls="hand: left"
                raycaster="objects: .interactable; far: 10; near: 0.05"
                controller-tracker="hand: left">
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
